<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#161A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="proGYM">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>proGYM — Allenamento intelligente</title>
<style>
.builder-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.builder-controls button{min-width:38px;min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;padding:5px 10px}
.builder-controls button:disabled{opacity:.3;cursor:default}
.builder-controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

:root{
  --bg:#161A21;
  --surface:#1E242D;
  --surface-2:#252C37;
  --line:#2F3845;
  --text:#EAF0F7;
  --muted:#8A97A8;
  --accent:#F5A524;
  --accent-dim:#5a3f11;
  --heavy:#FF5C7A;
  --medium:#FF9F45;
  --light:#3ED598;
  --ok:#3ED598;
  --gold:#FFD166;
  --radius:14px;
  --tap:48px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Samsung Sans","Roboto",sans-serif;
  line-height:1.45;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
input,button,select{font-family:inherit;font-size:1rem;color:inherit}
button{background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- Topbar ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:rgba(22,26,33,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.bar h1{font-size:1rem;font-weight:650;margin:0;letter-spacing:.2px;flex:1}
.bar h1 span{display:block;font-size:.75rem;font-weight:450;color:var(--muted)}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--surface);
  display:grid;place-items:center;font-size:1.05rem;border:1px solid var(--line);flex-shrink:0;
}
.days{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-tab{
  flex:1 0 auto;min-width:74px;padding:9px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);
  font-size:.82rem;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap;
}
.day-tab b{display:block;font-size:.66rem;font-weight:500;opacity:.8}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#1a1205}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}

/* ---------- Toast ---------- */
.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;z-index:90;
  background:var(--gold);color:#241a02;font-weight:700;font-size:.85rem;
  padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transform:translate(-50%,-16px);transition:all .25s ease;
  box-shadow:0 8px 22px rgba(0,0,0,.45);white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Session strip ---------- */
.session{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
}
.session label{font-size:.72rem;color:var(--muted);display:block}
.session input[type=date]{
  background:transparent;border:none;padding:0;font-size:.95rem;font-weight:600;color:var(--text);
}
.session .count{text-align:right;font-size:.95rem;font-weight:700}
.session .count small{display:block;font-size:.7rem;font-weight:500;color:var(--muted)}

.note-day{
  margin:0 14px 14px;padding:12px 14px;border-radius:var(--radius);
  background:var(--accent-dim);border:1px solid #6d4f18;
  font-size:.84rem;color:#ffe2b0;
}

/* ---------- Exercise card ---------- */
.ex{
  margin:0 14px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
.ex.done{border-color:#2e5f4a}
.ex-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px}
.ex-head .t{flex:1;min-width:0}
.ex-name{font-size:.98rem;font-weight:650;line-height:1.25}
.ex-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:.76rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.dot.heavy{background:var(--heavy)}.dot.medium{background:var(--medium)}.dot.light{background:var(--light)}
.info-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:.85rem;font-weight:700;flex-shrink:0}
.tip{
  margin:0 14px 12px;padding:10px 12px;border-left:2px solid var(--accent);
  background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.82rem;color:#cfd8e3;display:none;
}
.tip.open{display:block}

.suggest{
  margin:0 14px 10px;padding:9px 12px;border-radius:10px;
  background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.35);
  font-size:.8rem;color:#ffcf82;display:flex;gap:7px;align-items:flex-start;
}
.suggest b{color:var(--accent);flex-shrink:0}

.variant-tag{font-size:.72rem;color:var(--accent);font-weight:600;margin-top:2px}
.variant-list{display:flex;flex-wrap:wrap;gap:8px}
.variant-chip{
  padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-size:.85rem;color:var(--text);font-weight:600;
}
.variant-chip.active{background:var(--accent);border-color:var(--accent);color:#1a1205}

.sets{padding:0 10px 10px}
.set-row{
  display:grid;grid-template-columns:26px 1fr 1fr var(--tap);
  gap:8px;align-items:center;padding:5px 4px;position:relative;
}
.set-head{
  display:grid;grid-template-columns:26px 1fr 1fr var(--tap);gap:8px;
  padding:2px 4px 6px;font-size:.68rem;color:var(--muted);
}
.set-n{font-size:.8rem;color:var(--muted);text-align:center;font-weight:600}
.fld{position:relative}
.fld input{
  width:100%;height:var(--tap);border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);padding:0 10px;font-size:1.05rem;font-weight:600;text-align:center;
}
.fld input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld input::placeholder{color:#5c6878;font-weight:500}
.chk{
  width:var(--tap);height:var(--tap);border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:#5c6878;position:relative;
}
.set-row.done .chk{background:var(--ok);border-color:var(--ok);color:#0d2a1e}
.set-row.done .fld input{opacity:.65}
.set-row.pr .fld input{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pr-star{position:absolute;top:-6px;left:-4px;font-size:.75rem}
.last{font-size:.68rem;color:var(--muted);padding:0 4px 8px;text-align:center;grid-column:1/-1}
.set-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:4px 4px 6px}.set-actions .mini{min-width:0;min-height:44px;height:auto;padding:6px 3px;white-space:normal;overflow-wrap:anywhere}.analytics-status{margin:8px 0}.analytics-status .big-btn{margin:5px 0}
.mini{
  flex:1;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-size:.78rem;color:var(--muted);font-weight:600;
}

/* ---------- Profilo, feedback ---------- */
.feedback{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:5px 4px 10px}
.feedback label{font-size:.69rem;color:var(--muted)}
.feedback select,.profile-field input,.profile-field select{width:100%;min-height:42px;margin-top:5px;padding:7px 8px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:9px}
.profile-field{display:block;color:var(--muted);font-size:.8rem;margin:10px 0}
/* ---------- Coaching leggibile ---------- */
.previous-workout{margin:0 14px 10px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.previous-workout strong{font-size:.79rem;color:var(--accent)}
.previous-workout .line{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.previous-workout .pill{padding:5px 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:.8rem}
.previous-workout .muted{margin-top:7px;font-size:.73rem;color:var(--muted)}
.profile-days{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}
.profile-days label{display:flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:.8rem}
.profile-days input{accent-color:var(--accent)}
/* ---------- v2.2: mobile navigation / first start / guided setup ---------- */
body{padding-bottom:calc(155px + env(safe-area-inset-bottom))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(30,36,45,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bottom-nav button{min-height:53px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:var(--muted);font-size:.72rem}
.bottom-nav button span{font-size:1.15rem}
.bottom-nav button.active{color:var(--accent);background:rgba(245,165,36,.1)}
.timer{bottom:calc(80px + env(safe-area-inset-bottom))!important}
.welcome{margin:12px 14px;padding:16px;border-radius:16px;background:linear-gradient(145deg,#33311f,var(--surface));border:1px solid rgba(245,165,36,.4)}
.welcome h2{font-size:1.05rem;margin:0 0 6px}.welcome p{color:#cfd8e3;font-size:.82rem;margin:0 0 12px}.welcome button{background:var(--accent);padding:10px 14px;border-radius:10px;font-weight:700;color:#241a02}
.steps{display:flex;gap:7px;margin:12px 0 16px}.steps i{height:5px;flex:1;border-radius:5px;background:var(--line)}.steps i.on{background:var(--accent)}
.profile-field textarea{width:100%;min-height:80px;margin-top:5px;padding:9px 10px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:9px;resize:vertical}
.profile-field input[type=checkbox]{width:auto;min-height:0}
.preview-day{padding:10px;margin:8px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:.82rem}
.preview-day small{display:block;color:var(--muted);margin-top:4px}
.rest-detail{color:var(--muted);font-size:.72rem;padding:0 12px 8px}
/* ---------- Rest timer ---------- */
.timer{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
  background:var(--surface);border:1px solid var(--accent);border-radius:16px;
  padding:12px 14px;display:none;align-items:center;gap:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.timer.on{display:flex}
.timer.expired{border-color:#3ED598;background:#173329}
.timer.expired .n{font-size:1.06rem;min-width:100px;color:#b4f6d4}
.timer.expired #timerAdd{display:none}
.timer.expired #timerStop{background:#3ED598;color:#092319;border-color:#3ED598;font-weight:800}
.flexible-hint{margin:8px 14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;color:var(--muted)}
.flexible-hint b{color:var(--accent)}
.timer .n{font-size:1.8rem;font-weight:700;letter-spacing:-.5px;min-width:86px}
.timer .lbl{flex:1;font-size:.78rem;color:var(--muted)}
.timer button{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.timer .ring{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.timer .ring i{display:block;height:100%;background:var(--accent)}

/* ---------- Sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:85vh;overflow-y:auto;
  background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:18px 16px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .22s ease;
}
.sheet.on{transform:translateY(0)}
.sheet h2{margin:0 0 4px;font-size:1.05rem}
.sheet .sub{color:var(--muted);font-size:.8rem;margin-bottom:14px}
.hist{border-top:1px solid var(--line);padding:11px 0}
.hist b{font-size:.82rem;font-weight:600}
.hist p{margin:4px 0 0;font-size:.85rem;color:#cfd8e3}
.hist .pr-tag{color:var(--gold);font-weight:700;font-size:.7rem;margin-left:6px}
.big-btn{
  width:100%;height:50px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);font-weight:600;margin-top:10px;
}
.big-btn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.big-btn.danger{color:#ff8b9e}
.empty{color:var(--muted);font-size:.85rem;padding:14px 0}
.warn{font-size:.75rem;color:var(--muted);margin-top:14px;line-height:1.5}

/* ---------- Chart ---------- */
.chart-box{margin:6px 0 4px}
.chart{width:100%;height:90px;display:block}
.chart-range{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:2px}

/* ---------- Weekly stats ---------- */
.week-range{font-size:.78rem;color:var(--muted);margin-bottom:2px}
.mbar{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:10px;padding:8px 0}
.mlabel{font-size:.8rem;color:#cfd8e3}
.mtrack{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.mtrack i{display:block;height:100%;background:var(--accent);border-radius:6px}
.mval{font-size:.82rem;font-weight:700;text-align:right}

/* proGYM 3.2: report a colori e cronometro verificabile */
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.report-card{min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:12px}
.report-label{color:var(--muted);font-size:.75rem;display:block;margin-bottom:4px}
.report-value{font-size:1.18rem;font-weight:750;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.report-change{font-size:.78rem;font-weight:700;display:inline-block;margin-top:4px}
.report-up{color:#52e4a4}.report-down{color:#ff8989}.report-neutral{color:#aab6c8}.report-caution{color:#ffc36c}
.report-exercise{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;background:var(--surface-2)}
.report-exercise strong{display:block;font-size:.91rem;margin-bottom:6px}
.report-exercise small{display:block;color:var(--muted);margin-top:3px}
.chrono-strip{border:1px solid var(--line);background:var(--surface-2);padding:12px;border-radius:12px;margin:8px 0}
.chrono-strip .num{font-size:1.25rem;font-weight:800}
.chrono-strip small{display:block;color:var(--muted);font-size:.73rem}
.chrono-reset{display:inline-block;font-size:.73rem;color:var(--accent);text-decoration:underline;padding:7px 0}
@media(max-width:330px){.report-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="t" style="flex:1">
      <h1 id="dayTitle">—<span id="daySub">—</span></h1>
    </div>
    <button class="icon-btn" id="btnProgram" aria-label="Gestione programma" style="display:none">⇄</button>
    <button class="icon-btn" id="btnProfile" aria-label="Profilo atleta" style="display:none">👤</button>
    <button class="icon-btn" id="btnWeekly" aria-label="Statistiche settimanali" style="display:none">📊</button>
    <button class="icon-btn" id="btnSettings" aria-label="Impostazioni">⚙</button>
  </div>
  <div class="days" id="days"></div>
  <div class="progress"><i id="progBar"></i></div>
</header>

<div class="toast" id="toast"></div>

<div class="session">
  <div>
    <label for="dateInput">Allenamento del</label>
    <input type="date" id="dateInput">
  </div>
  <div class="count"><span id="doneCount" class="num">0/0</span><small>serie completate</small></div>
</div>

<div id="welcomeBox"></div>
<div id="dayNote"></div>
<main id="list"></main>

<div class="timer" id="timer">
  <div>
    <div class="n num" id="timerNum">0:00</div>
    <div class="ring"><i id="timerRing"></i></div>
  </div>
  <div class="lbl" id="timerLbl">Recupero</div>
  <button id="timerAdd">+30s</button>
  <button id="timerStop">Interrompi</button>
</div>

<nav class="bottom-nav" aria-label="Navigazione principale">
  <button data-nav="workout" class="active"><span>🏋</span>Allenati</button>
  <button data-nav="program"><span>📋</span>Scheda</button>
  <button data-nav="stats"><span>📊</span>Progressi</button>
  <button data-nav="profile"><span>👤</span>Profilo</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script>
/* =========================================================
   1. LA SCHEDA
   muscle: gruppo muscolare usato per il riepilogo settimanale
   ========================================================= */
// Un'installazione nuova non ha alcuna scheda preimpostata.
// Ogni utente importa la propria scheda (o la crea tramite AI).
let PROGRAM = [];
const MUSCLES = ["Petto","Dorso","Spalle","Bicipiti","Tricipiti","Quadricipiti","Femorali","Adduttori","Polpacci","Core","Collo"];
let MUSCLE_OF = {};

function rebuildMuscles(){ MUSCLE_OF = {}; PROGRAM.forEach(d => d.ex.forEach(e => MUSCLE_OF[e.id] = e.muscle)); }
rebuildMuscles();

/* =========================================================
   2. STORAGE
   ========================================================= */
const KEY = "palestra_v1";
const TKEY = "palestra_timer_v1";
const PKEY = "palestra_program_v2";
const PROFILE_KEY = "palestra_profile_v2";
// v3.0: archiviazione versionata locale. Non pubblicare mai i backup personali.
const ARCHIVE_KEY = "progym_program_archive_v30";
const ACTIVE_VERSION_KEY = "progym_active_version_v30";
const SESSION_VERSIONS_KEY = "progym_session_versions_v30";
const HISTORY_LINKS_KEY = "progym_history_links_v303";
const ACTIVE_CREATED_KEY = "progym_active_created_at_v303";
function historyLinks(){return readJSON(HISTORY_LINKS_KEY,{});}
function activeCreated(){return localStorage.getItem(ACTIVE_CREATED_KEY)||"";}
function formatArchiveDate(iso){if(!iso)return "Data non disponibile";const d=new Date(iso);return Number.isNaN(d.getTime())?"Data non disponibile":d.toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function readJSON(key, fallback){try{return JSON.parse(localStorage.getItem(key)) ?? fallback;}catch(_){return fallback;}}
function writeJSON(key,value){localStorage.setItem(key,JSON.stringify(value));}
function newVersionId(){return "pv_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);}
function archiveList(){return readJSON(ARCHIVE_KEY,[]);}
function currentVersion(){return localStorage.getItem(ACTIVE_VERSION_KEY)||"";}
function snapshotActive(reason){
 const raw=localStorage.getItem(PKEY);
 if(!raw)return;
 const list=archiveList(), id=currentVersion()||newVersionId();
 if(list.some(x=>x.id===id))return;
 const obj=JSON.parse(raw);
 list.unshift({id,reason:reason||"Modifica scheda",savedAt:new Date().toISOString(),createdAt:activeCreated()||null,name:String(obj.program?.name||"Scheda"),program:obj});
 writeJSON(ARCHIVE_KEY,list);
}
function stampSessionVersion(){
 const k=sessionKey(), map=readJSON(SESSION_VERSIONS_KEY,{});
 if(!map[k]){map[k]=currentVersion()||"legacy";writeJSON(SESSION_VERSIONS_KEY,map);}
}
// Dizionario conservativo: normalizza solo grafie, non assimila prese differenti.
const EXERCISE_ALIASES={
 "lat pulldown presa neutra":"lat machine presa neutra",
 "lat pulldown presa prona":"lat machine presa prona",
 "lat pulldown presa supina":"lat machine presa supina"
};
function biomechKey(name){
 let n=String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
 return EXERCISE_ALIASES[n]||n;
}
const Store = (() => {
  let mem = null, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    load(){
      if(mem) return mem;
      try{ mem = JSON.parse(localStorage.getItem(KEY)) || {sessions:{}}; }
      catch(e){ mem = {sessions:{}}; }
      if(!mem.sessions) mem.sessions = {};
      return mem;
    },

  if(!db.sessions[k] && create) db.sessions[k] = {};
  return db.sessions[k] || {};
}
// Normalizza i dati "vecchio formato" (array di serie) in {variant, sets}
function normalizeRaw(ex, raw){
  if(!raw) return null;
  if(Array.isArray(raw)) return {variant: ex.name, sets: raw};
  return raw;
}
// Ritorna {variant, sets} per l'esercizio nella sessione corrente
function exEntry(ex, create=false){
  const s = session(create);
  let raw = normalizeRaw(ex, s[ex.id]);
  if(!raw && create){
    stampSessionVersion();
    raw = {variant: ex.name, identity:biomechKey(ex.name), muscle:ex.muscle, sets: Array.from({length:ex.sets}, () => ({w:"",r:"",d:false}))};
  }
  if(raw && create){if(!raw.identity)raw.identity=biomechKey(raw.variant||ex.name); s[ex.id] = raw;}
  return raw;
}
// Cerca lo storico dell'esercizio attuale e, solo dopo conferma dell'utente,
// gli ID delle vecchie schede associati alla medesima variante biomeccanica.
function automaticHistorySource(ex,variant){
 // Aggancio conservativo: nome normalizzato identico, un solo ID storico candidato.
 // Se la variante o il macchinario sono ambigui, richiedi il collegamento manuale.
 if(biomechKey(variant)!==biomechKey(ex.name))return null;
 const candidates=historicalCandidates(ex).filter(c=>biomechKey(c.variant)===biomechKey(variant));
 if(candidates.length!==1)return null;
 const duplicate=PROGRAM.flatMap(d=>d.ex).filter(e=>e.id!==ex.id&&biomechKey(e.name)===biomechKey(ex.name));
 if(duplicate.length)return null;
 return {sourceId:candidates[0].id,sourceVariant:candidates[0].variant,targetVariant:variant,automatic:true};
}
function historyRecords(ex,variant,options={}){
 const db=Store.load(), links=historyLinks();
 const link=links[ex.id]||automaticHistorySource(ex,variant);
 const target=biomechKey(variant);
 const result=[];
 Object.keys(db.sessions||{}).forEach(k=>{
  if(!options.includeCurrent && (k===sessionKey() || k.split("__")[0]>=state.date))return;
  const sess=db.sessions[k]||{};
  // Prima cerca l'ID corrente; non interpreta automaticamente ID di altre schede.
  const direct=normalizeRaw(ex,sess[ex.id]);
  if(direct && !direct.skipped && biomechKey(direct.variant||ex.name)===target && (!direct.identity||direct.identity===target) && direct.sets?.some(x=>x.d||x.w||x.r))result.push({k,raw:direct,sourceId:ex.id});
  if(link && link.sourceId!==ex.id && biomechKey(link.targetVariant)===target){
    const raw=normalizeRaw(ex,sess[link.sourceId]);
    if(raw && !raw.skipped && biomechKey(raw.variant||link.sourceVariant)===biomechKey(link.sourceVariant) && (!raw.identity||raw.identity===biomechKey(link.sourceVariant)) && raw.sets?.some(x=>x.d||x.w||x.r))result.push({k,raw,sourceId:link.sourceId});
  }
 });
 result.sort((a,b)=>a.k.localeCompare(b.k));
 return result;
}
function lastPerformance(ex,variant){
 const rows=historyRecords(ex,variant,{includeCurrent:false});
 if(!rows.length)return null;
 const last=rows[rows.length-1];
 return {date:last.k.split("__")[0],sets:last.raw.sets};
}
function bestWeightBefore(ex,variant){
 let best=null;
 historyRecords(ex,variant,{includeCurrent:false}).forEach(({raw})=>raw.sets.forEach(set=>{
  const w=parseFloat(set.w);
  if(set.d && !Number.isNaN(w) && (best===null||w>best))best=w;
 }));
 return best;
}
function historicalCandidates(ex){
 const result=new Map(),db=Store.load();
 Object.entries(db.sessions||{}).forEach(([k,session])=>Object.entries(session||{}).forEach(([id,raw])=>{
  if(id===ex.id || !raw)return;
  const variant=String((!Array.isArray(raw)&&raw.variant)||'').trim();
  if(!variant)return; // vecchi array senza nome: evitare identificazioni inventate
  const sets=Array.isArray(raw)?raw:raw.sets;
  if(!Array.isArray(sets)||!sets.some(x=>x.d && x.r!==''))return;
  const key=id+'\u0000'+variant;
  const o=result.get(key)||{id,variant,count:0,lastDate:'',sample:sets};
  o.count++;if(k.slice(0,10)>o.lastDate){o.lastDate=k.slice(0,10);o.sample=sets;}
  result.set(key,o);
 }));
 return [...result.values()].sort((a,b)=>{
  const aScore=biomechKey(a.variant)===biomechKey(ex.name)?1:0;
  const bScore=biomechKey(b.variant)===biomechKey(ex.name)?1:0;
  return bScore-aScore || b.lastDate.localeCompare(a.lastDate);
 });
}
function openHistoryLinker(exId){
 const ex=day()?.ex.find(e=>e.id===exId);if(!ex)return;
 const candidates=historicalCandidates(ex);
 const linked=historyLinks()[exId];
 const cards=candidates.map((c,i)=>`<div class="preview-day"><b>${safe(c.variant)}</b><small>${c.count} sedute · Ultima ${safe(c.lastDate)} · ID precedente: ${safe(c.id)}</small><div class="builder-controls"><button data-history-link="${i}">Collega a questo esercizio</button></div></div>`).join('');
 openSheet(`<h2>Collega storico precedente</h2><p class="sub">Esercizio nuovo: <b>${safe(ex.name)}</b>. Il collegamento non modifica le vecchie serie né i carichi. Conferma soltanto se il macchinario, la presa e la variante sono realmente confrontabili. Se sono diversi, lascia separati gli storici.</p>${linked?`<div class="preview-day"><b>Collegato a ${safe(linked.sourceVariant)}</b><small>ID ${safe(linked.sourceId)}</small><button class="big-btn" id="unlinkHistory">Rimuovi collegamento</button></div>`:''}${cards||'<p>Nessuna registrazione precedente identificabile. Puoi mantenere il nuovo storico separato.</p>'}<button class="big-btn" id="linkerBack">Torna alla scheda</button>`);
 $('linkerBack').onclick=()=>{closeSheet();renderList();};
 if(linked)$('unlinkHistory').onclick=()=>{if(!confirm('Rimuovere questo collegamento? I dati originali restano intatti.'))return;const x=historyLinks();delete x[exId];writeJSON(HISTORY_LINKS_KEY,x);openHistoryLinker(exId);renderList();};
 document.querySelectorAll('[data-history-link]').forEach(b=>b.onclick=()=>{
  const c=candidates[Number(b.dataset.historyLink)];
  if(!confirm(`Confermi che “${c.variant}” e “${ex.name}” si riferiscono allo stesso esercizio, stessa presa e macchina confrontabile?\n\nLe registrazioni resteranno separate nei dati, ma compariranno insieme nel coach.`))return;
  const x=historyLinks();x[exId]={sourceId:c.id,sourceVariant:c.variant,targetVariant:ex.name,linkedAt:new Date().toISOString()};
  writeJSON(HISTORY_LINKS_KEY,x);closeSheet();renderList();showToast('Storico precedente collegato');
 });
}

/* ---------- Progressione suggerita ---------- */
function parseRepRange(reps){
  const clean = reps.replace("s","");
  const parts = clean.split("-").map(Number);
  return parts.length === 2 ? parts : [parts[0], parts[0]];
}
function roundHalf(n){ return Math.round(n*2)/2; }
function previousWorkoutBox(ex,variant){
  const last=lastPerformance(ex,variant);
  if(!last)return "";
  const sets=last.sets.filter(s=>s.d && s.r!=="" && s.r!=null);
  if(!sets.length)return "";
  const items=sets.map((s,i)=>`<span class="pill">${i+1}ª: <b>${safe(s.r)} rip.</b>${ex.bw ? (Number(s.w)>0?" · +"+safe(weightText(s.w,ex)):" · corpo libero") : (s.w!==""?" · "+safe(weightText(s.w,ex)):"")}</span>`).join("");
  return `<div class="previous-workout"><strong>ULTIMA VOLTA · ${dmy(last.date)}</strong><div class="line">${items}</div><div class="muted">Questi valori sono lo storico registrato, non obiettivi ancora da completare.</div></div>`;
}
function coachingMode(){
 const p=getProfile(),g=String(p.goal||"Ipertrofia"),years=Number(p.experience);
 return {goal:g,level:!Number.isFinite(years)||years<1?"iniziale":years<3?"intermedio":"avanzato",increment:Number(p.loadIncrementKg)>0?Number(p.loadIncrementKg):2.5};
}
function suggestion(ex,variant){
  if(ex.unit==="sec")return null;
  const last=lastPerformance(ex,variant);
  if(!last)return "Registra una seduta completa per ricevere un consiglio basato sui tuoi dati.";
  const completed=last.sets.filter(s=>s.d && s.r!=="" && s.r!=null && Number.isFinite(Number(s.r)));
  if(!completed.length)return "Mancano ripetizioni registrate nella seduta precedente: completa il diario per avere consigli.";
  const [min,max]=parseRepRange(ex.reps);
  const reps=completed.map(s=>Number(s.r));
  const weightValues=completed.map(s=>s.w===""||s.w==null?null:Number(s.w));
  const hasWeights=weightValues.every(v=>v!==null && Number.isFinite(v));
  const sameLoad=hasWeights && weightValues.every(v=>v===weightValues[0]);
  const total=reps.reduce((a,b)=>a+b,0);
  const commonLoad=sameLoad ? weightValues[0] : null;
  const loadText=ex.bw?(commonLoad>0?`+${weightText(commonLoad,ex)} di zavorra`:`il corpo libero`):commonLoad!==null?`${weightText(commonLoad,ex)}`:`il carico precedente`;
  if(completed.length!==ex.sets)return `Hai registrato ${completed.length} serie su ${ex.sets} previste. <b>Ripeti il carico e completa il programma</b> prima di aumentarlo.`;
  if(!sameLoad)return `L'ultima seduta contiene carichi diversi o mancanti: <b>consolida le serie</b> e confronta tecnica e ripetizioni; nessun aumento automatico.`;
  if(reps.some(n=>n<min))return `Ultima seduta: ${reps.join(" / ")} rip. (totale ${total}), almeno una serie sotto ${min}. <b>Consolida ${loadText}</b> o riducilo se la tecnica peggiora.`;
  if(reps.every(n=>n>=max)){
    const mode=coachingMode();
    const inc=weightUnit(ex)==="lb"? Math.round(mode.increment/KG_PER_LB*10)/10:mode.increment;
    const suffix=ex.bw?"di zavorra, se appropriata":"sul macchinario, se disponibile";
    return `Ultima seduta: ${reps.join(" / ")} rip. (totale ${total}). <b>Hai raggiunto ${ex.sets} × ${max}.</b> Per ${safe(mode.goal.toLowerCase())} (${mode.level}) valuta un incremento minimo di circa <b>${inc} ${weightUnit(ex)}</b> ${suffix}, soltanto se tecnica e RIR ${ex.rir} erano rispettati. In alternativa ripeti il carico per confermare il risultato.`;
  }
  const target=[...reps];
  for(let i=target.length-1;i>=0;i--){if(target[i]<max){target[i]++;break;}}
  const mode=coachingMode();
  return `Obiettivo ${safe(mode.goal)} · livello ${mode.level}. Ultima seduta: <b>${reps.join(" / ")} rip.</b> (totale ${total}). Mantieni <b>${loadText}</b> e prova <b>${target.join(" / ")}</b> (totale ${total+1}), conservando tecnica e RIR ${ex.rir}. È un suggerimento, non un obbligo.`;
}

      ${!skipped && sugg ? `<div class="suggest"><b>→</b><span>${sugg}<br><small>Target aumento: ${ex.sets} × ${threshold} rip. a carico costante, tecnica stabile e RIR ${ex.rir}.</small></span></div>` : ""}
      <div class="sets">

function updateProgress(){
  if(!day()){$("doneCount").textContent="0/0";$("progBar").style.width="0%";return;}
  let done = 0, tot = 0;
  day().ex.forEach(ex => {
    const entry = exEntry(ex);
    const rows = entry ? entry.sets : Array.from({length:ex.sets},()=>({d:false}));
    if(entry?.skipped===true)return;
    tot += rows.length;
    done += rows.filter(r => r.d).length;
  });
  $("doneCount").textContent = done + "/" + tot;
  $("progBar").style.width = tot ? (done/tot*100)+"%" : "0%";
}

function openSkipExercise(exId){
 const ex=day()?.ex.find(e=>e.id===exId);if(!ex)return;

function setSkipped(exId,yes,reason=""){
 const ex=day()?.ex.find(e=>e.id===exId);if(!ex)return;
 const entry=exEntry(ex,true);
 if(yes && entry.sets.some(s=>s.d||s.w!==""||s.r!=="") && !confirm("Questo esercizio contiene già serie registrate. Saltarlo ora conserverà le serie già completate nel riepilogo. Le serie non eseguite resteranno escluse. Continuare?"))return;
 if(!yes)reopenWorkout();
 entry.skipped=!!yes;entry.skipReason=yes?reason:"";
 Store.save();closeSheet();renderList();
 if(yes){if(exerciseDoneForDate(day())){stopTimer();showSessionComplete();}else showToast("Esercizio saltato solo oggi");}
 else showToast("Esercizio ripristinato");

function toggleSet(row){
  const ex = day().ex.find(x => x.id === row.dataset.ex);
  const entry = exEntry(ex, true);
  if(entry.skipped)return;
  const rows = entry.sets;
  const i = +row.dataset.i;
  const s = rows[i];
  if(!s.d){startWorkout();reopenWorkout();}
  s.d = !s.d;
  if(!s.d)reopenWorkout();

  if(s.d){
    if(!s.w && !s.r){
      const prev = rows.slice(0,i).reverse().find(x => x.w || x.r);
      const last = lastPerformance(ex, entry.variant);
      const src = prev || (last && last.sets[i]) || null;
      if(src){ s.w = src.w || ""; s.r = src.r || ""; }
    }
    const best = bestWeightBefore(ex, entry.variant);
    const w = parseFloat(s.w);
    if(!ex.bw && best !== null && !isNaN(w) && w > best){
      const label = entry.variant !== ex.name ? `${ex.name} (${entry.variant})` : ex.name;
      showToast(`🏆 Nuovo record su ${label}: ${weightText(w,ex)}`);
    }
    // Non avviare il recupero dopo l'ultima serie della giornata.
    Store.save();
    if(exerciseDoneForDate(day())){
      stopTimer();
      renderList();
      showSessionComplete();
      return;
    }
    startTimer(effectiveRest(ex), ex.name);
  }
  Store.save();
  renderList();
}

function changeSets(exId, delta){
  const ex = day().ex.find(x => x.id === exId);
  const entry = exEntry(ex, true);
  const rows = entry.sets;
  if(delta > 0 && rows.length < 10){rows.push({w:"",r:"",d:false});reopenWorkout();}
  if(delta < 0 && rows.length > 1) rows.pop();
  Store.save();
  renderList();
}

const ALARM_SETTINGS_KEY="progym_alarm_settings_v25";
const DEFAULT_ALARM={sound:true,vibration:true,notifications:false};
function getAlarmSettings(){try{return {...DEFAULT_ALARM,...JSON.parse(localStorage.getItem(ALARM_SETTINGS_KEY)||"{}")} }catch(_){return {...DEFAULT_ALARM}}}
let t={endTime:null,total:0,label:"",id:null,expired:false,alertId:null,notified:false};
const TIMER_NOTIFICATION_TAG="progym-rest";
function persistTimer(){
 try{if(t.endTime||t.expired)localStorage.setItem(TKEY,JSON.stringify({endTime:t.endTime,total:t.total,label:t.label,expired:t.expired}));else localStorage.removeItem(TKEY);}catch(_){}
}
function supportsScheduledNotifications(){return typeof window.TimestampTrigger!=="undefined" && "serviceWorker" in navigator;}
async function getTimerRegistration(){
 if(!("serviceWorker" in navigator))return null;
 try{return await navigator.serviceWorker.ready}catch(_){return null;}
}
async function clearScheduledRestNotification(){
 try{const reg=await getTimerRegistration();if(!reg?.getNotifications)return;
  const notifications=await reg.getNotifications({tag:TIMER_NOTIFICATION_TAG,includeTriggered:true});notifications.forEach(n=>n.close());
 }catch(_){}
}
async function scheduleRestNotification(endTime){
 if(!getAlarmSettings().notifications||!("Notification" in window)||Notification.permission!=="granted"||!supportsScheduledNotifications())return;
 try{const reg=await getTimerRegistration();if(!reg)return;
  const n=await reg.getNotifications({tag:TIMER_NOTIFICATION_TAG,includeTriggered:true});n.forEach(x=>x.close());
  if(t.endTime!==endTime)return;
  await reg.showNotification("proGYM · Recupero terminato",{body:"Torna all’allenamento. Conferma nell’app per silenziare l’avviso.",tag:TIMER_NOTIFICATION_TAG,icon:"icon-192.png",badge:"icon-192.png",requireInteraction:true,showTrigger:new TimestampTrigger(endTime)});
 }catch(err){console.info("Notifica temporizzata non disponibile:",err);}
}
async function showRestNotification(){
 if(!getAlarmSettings().notifications||!("Notification" in window)||Notification.permission!=="granted"||t.notified)return;
 t.notified=true;
 try{const reg=await getTimerRegistration();if(reg)await reg.showNotification("proGYM · Recupero terminato",{body:"Il tempo di recupero è finito. Apri proGYM e conferma.",tag:TIMER_NOTIFICATION_TAG,icon:"icon-192.png",requireInteraction:true});}catch(_){}
}
function startTimer(sec,label){
 clearInterval(t.id);clearInterval(t.alertId);clearScheduledRestNotification();
 t.endTime=Date.now()+sec*1000;t.total=sec;t.label=label;t.expired=false;t.notified=false;
 persistTimer();$("timer").classList.remove("expired");$("timer").classList.add("on");
 $("timerLbl").textContent="Recupero · "+label;$("timerStop").textContent="Interrompi";
 // Nessun wake lock: l'utente può spegnere il display. Il tempo è basato sull'orologio reale.
 tick();t.id=setInterval(tick,350);scheduleRestNotification(t.endTime);
}
function tick(){
 if(!t.endTime||t.expired)return;
 const left=Math.max(0,Math.ceil((t.endTime-Date.now())/1000));
 $("timerNum").textContent=fmt(left);$("timerRing").style.width=(left/t.total*100)+"%";
 if(left<=0)endTimer();
}
function activeAlarmSignal(){
 if(!t.expired || document.visibilityState!=="visible")return;
 const prefs=getAlarmSettings();
 if(prefs.sound)beep();
 if(prefs.vibration && navigator.vibrate)navigator.vibrate([350,140,350,140,500]);
}
function endTimer(){
 if(t.expired)return;
 clearInterval(t.id);t.endTime=null;t.expired=true;persistTimer();
 $("timer").classList.add("on","expired");$("timerNum").textContent="TEMPO FINITO";
 $("timerRing").style.width="0%";$("timerLbl").textContent="Recupero finito · "+t.label;
 $("timerStop").textContent="Ho ripreso ✓";
 activeAlarmSignal();clearInterval(t.alertId);t.alertId=setInterval(activeAlarmSignal,8000);
 showRestNotification();
}
function stopTimer(){
 clearInterval(t.id);clearInterval(t.alertId);
 t.endTime=null;t.expired=false;t.notified=false;persistTimer();
 $("timer").classList.remove("on","expired");
 if(navigator.vibrate)navigator.vibrate(0);
 clearScheduledRestNotification();
}
$("timerStop").onclick=stopTimer;
$("timerAdd").onclick=()=>{
 if(!t.endTime||t.expired)return;
 t.endTime+=30000;t.total=Math.max(t.total,Math.ceil((t.endTime-Date.now())/1000));
 persistTimer();tick();clearScheduledRestNotification().then(()=>scheduleRestNotification(t.endTime));
};
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"){
  if(t.endTime)tick();
  else if(t.expired)activeAlarmSignal();
 }
});
(function resumeTimer(){
 try{const raw=localStorage.getItem(TKEY);if(!raw)return;const saved=JSON.parse(raw);
  t.label=saved.label||"Recupero";t.total=saved.total||180;
  if(saved.expired || (saved.endTime && saved.endTime<=Date.now())){endTimer();return;}
  if(saved.endTime){t.endTime=saved.endTime;$("timerLbl").textContent="Recupero · "+t.label;$("timer").classList.add("on");tick();t.id=setInterval(tick,350);}
 }catch(_){}
})();
async function enableRestNotifications(){
 if(!("Notification" in window)){alert("Le notifiche non sono disponibili su questo browser.");return;}
 try{
  const result=await Notification.requestPermission();
  const cfg=getAlarmSettings();cfg.notifications=(result==="granted");localStorage.setItem(ALARM_SETTINGS_KEY,JSON.stringify(cfg));
  alert(result==="granted"?"Notifiche abilitate. L'avviso sullo schermo bloccato dipende dal supporto del browser: "+(supportsScheduledNotifications()?"è disponibile la pianificazione sperimentale.":"questa versione del browser NON supporta la pianificazione a schermo spento."):"Autorizzazione notifiche non concessa.");
 }catch(err){alert("Impossibile abilitare le notifiche: "+err.message);}
}

  <button class="big-btn" id="alarmTestSound">Prova suono/vibrazione</button>

 $("alarmEnableNotifications").onclick=enableRestNotifications;
 $("alarmTestSound").onclick=()=>{beep();if(navigator.vibrate)navigator.vibrate([250,150,250]);};
 $("alarmSave").onclick=()=>{const updated={...getAlarmSettings(),sound:$("alarmSound").checked,vibration:$("alarmVibration").checked};localStorage.setItem(ALARM_SETTINGS_KEY,JSON.stringify(updated));closeSheet();showToast("Avvisi salvati");};

let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,.28,.56].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, actx.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.35, actx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d+.2);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.22);
    });
  }catch(e){}
}
document.addEventListener("touchstart", function unlock(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  document.removeEventListener("touchstart", unlock);
}, {once:true});

function buildChart(points, chartUnit="kg"){
  if(points.length < 2) return "";
  const w=280, h=90, pad=10;
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = (w - 2*pad) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((p.value - min)/range) * (h - 2*pad);
    return [x.toFixed(1), y.toFixed(1)];
  });
  const line = coords.map(c => c.join(",")).join(" ");
  const dots = coords.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="var(--accent)"/>`).join("");
  return `<div class="chart-box">
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:4px">Andamento carico</div>
    <svg viewBox="0 0 ${w} ${h}" class="chart"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>
    <div class="chart-range"><span>${Math.round(min*100)/100} ${chartUnit}</span><span>${Math.round(max*100)/100} ${chartUnit}</span></div>
  </div>`;
}

function openHistory(exId){
  const ex = day().ex.find(x => x.id === exId);
  const db = Store.load();
  const todayEntry=exEntry(ex);
  const refVariant=todayEntry?todayEntry.variant:ex.name;
  const entries=historyRecords(ex,refVariant);

  const chartPoints = entries.map(x => {
    const weights = x.raw.sets.map(s => parseFloat(s.w)).filter(n => !isNaN(n));
    return weights.length ? {date:x.k.split("__")[0], value: Math.max(...weights)*(weightUnit(ex)==="lb" ? 1/KG_PER_LB : 1)} : null;
  }).filter(Boolean);

  const rows = entries.slice().reverse().slice(0,12).map(x => {
    const sets = x.raw.sets.filter(s => s.w || s.r);
    const weights = sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
    const topW = weights.length ? Math.max(...weights)*(weightUnit(ex)==="lb" ? 1/KG_PER_LB : 1) : null;
    const date = x.k.split("__")[0];
    let isPR = false;
    if(topW !== null){
      const bestSoFar = Math.max(...chartPoints.filter(p=>p.date<=date).map(p=>p.value), -Infinity);
      isPR = topW === bestSoFar && chartPoints.find(p=>p.value===topW)?.date === date;
    }
    const setsTxt = sets.map(s => `${s.w!==""?weightText(s.w,ex):"–"} × ${s.r||"–"}`).join("  ·  ");
    const vol = x.raw.sets.reduce((a,s)=> a + (parseFloat(s.w)||0)*(parseFloat(s.r)||0), 0);
    const variantTag = x.raw.variant !== ex.name ? `<span class="pr-tag" style="color:var(--muted)">· ${safe(x.raw.variant)}</span>` : "";
    return `<div class="hist"><b>${date.split("-").reverse().join("/")}</b>${isPR?'<span class="pr-tag">🏆 PR</span>':''}${variantTag}
            <p>${safe(setsTxt)}${vol?`  <span style="color:var(--muted)">· volume ${Math.round(vol)} kg</span>`:""}</p></div>`;
  }).join("");

  openSheet(`<h2>${safe(ex.name)}</h2><div class="sub">Ultimi allenamenti registrati${refVariant!==ex.name?` · grafico su "${refVariant}"`:""}</div>
    ${buildChart(chartPoints,weightUnit(ex))}
    ${rows || '<div class="empty">Nessun dato ancora. Compila i campi e spunta le serie: da qui in poi vedrai i progressi.</div>'}
    <button class="big-btn" id="historyLinkAction">Collega storico precedente</button><button class="big-btn" onclick="closeSheet()">Chiudi</button>`);
  $("historyLinkAction").onclick=()=>openHistoryLinker(exId);
}

function applyVariant(exId, variantName, newMuscle){
  const ex = day().ex.find(x => x.id === exId);
  const entry = exEntry(ex, true);
  if(entry.variant === variantName && (!newMuscle || entry.muscle===newMuscle)){ closeSheet(); return; }
  const hasData = entry.sets.some(s => s.w || s.r || s.d);
  if(hasData && !confirm("Cambiare variante azzera le serie già inserite oggi per questo esercizio. Continuare?")) return;
  entry.variant = variantName;
  entry.identity=biomechKey(variantName);
  entry.muscle = newMuscle || (variantName === ex.name ? ex.muscle : (entry.muscle || ex.muscle));
  entry.sets = Array.from({length: ex.sets}, () => ({w:"",r:"",d:false}));
  Store.save();
  closeSheet();
  renderList();
}

function isoWeekRange(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const offset = (d.getDay() + 6) % 7; // lunedì = 0
  const monday = new Date(d); monday.setDate(d.getDate() - offset);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return [monday.toISOString().slice(0,10), sunday.toISOString().slice(0,10)];
}
function weeklySets(dateStr){
  const [start,end] = isoWeekRange(dateStr);
  const db = Store.load();
  const totals = {}; [...new Set([...MUSCLES,...MUSCLE_OPTIONS])].forEach(m => totals[m] = 0);
  Object.keys(db.sessions).forEach(k => {
    const date = k.split("__")[0];
    if(date < start || date > end) return;
    const s = db.sessions[k];
    Object.keys(s).forEach(exId => {
      const muscle = (s[exId] && !Array.isArray(s[exId]) && s[exId].muscle) || MUSCLE_OF[exId];
      if(!muscle) return;
      if(!(muscle in totals)) totals[muscle]=0;
      const raw = s[exId];
      const setsArr = Array.isArray(raw) ? raw : (raw && raw.sets) || [];
      totals[muscle] += raw?.skipped ? 0 : setsArr.filter(x => x.d).length;
    });
  });
  return {start, end, totals};
}

function buildMarkdownExport(){
  let md = `# Scheda Palestra\n\n`;
  PROGRAM.forEach(d => {
    md += `## ${d.title} — ${d.sub}\n\n`;
    if(d.note) md += `> ${d.note}\n\n`;
    md += `| Esercizio | Serie × Reps | Carico | Recupero | Indicazione |\n|---|---|---|---|---|\n`;
    d.ex.forEach(ex => {
      const variants = ex.variants && ex.variants.length ? ` (varianti: ${ex.variants.join(", ")})` : "";
      const note = ex.tip.replace(/\|/g, "-");
      md += `| ${ex.name}${variants} | ${ex.sets}×${ex.reps} | ${ex.loadTxt} | ${fmt(ex.rest)} | ${note} |\n`;
    });
    md += "\n";
  });
  return md;
}
function exportMarkdown(){
  if(!PROGRAM.length){alert("Nessuna scheda disponibile: importa prima il tuo programma.");return;}
  const md = buildMarkdownExport();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(md).then(() => showToast("Markdown copiato negli appunti")).catch(() => {});
  }
  const blob = new Blob([md], {type:"text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scheda-palestra.md";
  a.click();
}

function exportData(){
  const blob = new Blob([JSON.stringify({sessions:Store.load().sessions,profile:getProfile(),restOverrides:getRestOverrides(),alarmSettings:getAlarmSettings(),activeProgram:localStorage.getItem(PKEY)?JSON.parse(localStorage.getItem(PKEY)):null,programArchive:archiveList(),activeVersion:currentVersion(),sessionVersions:readJSON(SESSION_VERSIONS_KEY,{}),historyLinks:historyLinks(),activeCreatedAt:activeCreated(),workoutMeta:workoutMeta()})], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "palestra-backup-" + todayISO() + ".json";
  a.click();
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const obj = JSON.parse(rd.result);
        if(!obj.sessions) throw 0;
        if(obj.activeProgram)validateProgram(obj.activeProgram,true);
        const cur = Store.load();
        Store.replace({sessions: Object.assign({}, cur.sessions, obj.sessions)});
        if(obj.profile && typeof obj.profile==="object") localStorage.setItem(PROFILE_KEY,JSON.stringify(obj.profile));
        if(obj.restOverrides && typeof obj.restOverrides==="object") localStorage.setItem(REST_OVERRIDES_KEY,JSON.stringify(obj.restOverrides));
        if(obj.alarmSettings && typeof obj.alarmSettings==="object")localStorage.setItem(ALARM_SETTINGS_KEY,JSON.stringify(obj.alarmSettings));
        if(Array.isArray(obj.programArchive)){const older=archiveList(), seen=new Set(older.map(x=>x.id));obj.programArchive.forEach(x=>{if(x&&typeof x.id==="string"&&x.program&&!seen.has(x.id)){older.push(x);seen.add(x.id);}});writeJSON(ARCHIVE_KEY,older);}
        if(obj.workoutMeta && typeof obj.workoutMeta==="object" && !Array.isArray(obj.workoutMeta))writeJSON(WORKOUT_META_KEY,{...workoutMeta(),...obj.workoutMeta});
        if(obj.sessionVersions && typeof obj.sessionVersions==="object")writeJSON(SESSION_VERSIONS_KEY,{...readJSON(SESSION_VERSIONS_KEY,{}),...obj.sessionVersions});
        if(obj.historyLinks && typeof obj.historyLinks==="object" && !Array.isArray(obj.historyLinks))writeJSON(HISTORY_LINKS_KEY,{...historyLinks(),...obj.historyLinks});
        if(obj.activeProgram){snapshotActive("Prima del ripristino backup");validateProgram(obj.activeProgram,true); localStorage.setItem(PKEY,JSON.stringify(obj.activeProgram)); loadProgram();state.dayId=PROGRAM[0].id;localStorage.setItem(ACTIVE_VERSION_KEY,obj.activeVersion||newVersionId());if(obj.activeCreatedAt)localStorage.setItem(ACTIVE_CREATED_KEY,obj.activeCreatedAt);renderDays();}
        closeSheet(); renderDays();renderList();renderWelcome();
      }catch(e){ alert("File non valido: serve un backup creato da questa app."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetDay(){
  if(!confirm("Azzeri i dati di " + dmy(state.date) + "?")) return;
  const db = Store.load();
  delete db.sessions[sessionKey()];
  const meta=workoutMeta();delete meta[sessionKey()];writeJSON(WORKOUT_META_KEY,meta);
  Store.save(); closeSheet(); renderList();
}
function wipe(){
  if(!confirm("Cancelli tutto lo storico? L'operazione non è reversibile.")) return;
  Store.replace({sessions:{}});writeJSON(WORKOUT_META_KEY,{});
  closeSheet(); renderList();
}

function parseGuidedWorkoutText(raw){
 const lines=String(raw||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!lines.length)throw Error('Incolla almeno un esercizio.');
 const days=[];let current=null;
 for(const [i,line] of lines.entries()){
  if(/^```/.test(line)||/^(?:scheda|programma)\s*:/i.test(line))continue;
  if(line.startsWith('#')){
   const title=line.replace(/^#+\s*/,'').trim();if(!title)throw Error('Intestazione della giornata vuota.');
   const wd=WEEKDAYS.findIndex(x=>x&&new RegExp(x,'i').test(title));
   current={name:title,weekday:wd>0?wd:null,exercises:[]};days.push(current);continue;
  }
  if(!line.includes('|'))throw Error('Riga '+(i+1)+' non riconosciuta. Usa: Nome | 3x8-12 | 180 | Dorso');
  if(!current){const first=Number(getProfile().trainingWeekdays?.[0])||1;current=blankManualDay(first);days.push(current);}
  const x=line.split('|').map(v=>v.trim());if(x.length<2||x.length>4)throw Error('Riga '+(i+1)+': usa Nome | 3x8-12 | 180 | Dorso');
  const match=x[1].match(/^(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?$/i);if(!match)throw Error('Riga '+(i+1)+': formato serie/ripetizioni non valido.');
  let muscle=x[3]||recognizeMuscle(x[0])||'Altro';muscle=MUSCLE_OPTIONS.find(m=>m.toLowerCase()===muscle.toLowerCase())||'Altro';
  current.exercises.push({name:x[0],sets:Number(match[1]),reps:match[3]?match[2]+'-'+match[3]:match[2],restSeconds:Number(x[2]||getProfile().defaultRestSeconds||180),muscle});
 }
 const p=getProfile();const avail=p.trainingWeekdays||[];const used=new Set();
 for(const d of days){if(p.scheduleMode==='flexible'){d.weekday=null;continue;}if(!d.weekday||used.has(d.weekday)){d.weekday=[...avail,1,2,3,4,5,6,7].find(n=>!used.has(Number(n)))||1;}used.add(d.weekday);}
 return {schemaVersion:'1.0',program:{name:'Scheda da testo',days}};
}

// v3.0.2 — Correzione mirata dei caratteri di escape aggiunti copiando testo AI.
// Non altera mai il contenuto delle stringhe JSON (nomi, note, varianti).
// Esempio: {"variants": \["Lat neutra"\]} -> {"variants": ["Lat neutra"]}
function fixCopiedJSONBrackets(source){
 let output='', inString=false, escaped=false, fixes=0;
 for(let i=0;i<source.length;i++){
  const ch=source[i];
  if(inString){
   output+=ch;
   if(escaped){escaped=false;continue;}
   if(ch==='\\'){escaped=true;continue;}
   if(ch==='"')inString=false;
   continue;
  }
  if(ch==='"'){inString=true;output+=ch;continue;}
  // Alcune interfacce di chat copiano le parentesi strutturali con uno slash.
  // Ripara SOLO i backslash davanti a parentesi strutturali fuori dalle stringhe.
  if(ch==='\\' && i+1<source.length && '[]{}'.includes(source[i+1])){
   output+=source[i+1];i++;fixes++;continue;
  }
  output+=ch;
 }
 return {text:output,fixes};
}
// Estrae il primo oggetto di programma completo, senza scambiare le parentesi
// presenti in note o nomi di esercizi con parentesi strutturali.
function findProgramJSON(raw){
 for(let start=raw.indexOf('{');start>=0;start=raw.indexOf('{',start+1)){
  let depth=0,inString=false,escaped=false;
  for(let i=start;i<raw.length;i++){
   const ch=raw[i];
   if(inString){
    if(escaped){escaped=false;continue;}
    if(ch==='\\'){escaped=true;continue;}
    if(ch==='"')inString=false;
    continue;
   }
   if(ch==='"'){inString=true;continue;}
   if(ch==='{')depth++;
   if(ch==='}' && --depth===0){
    try{
     const candidate=JSON.parse(raw.slice(start,i+1));
     if(candidate && typeof candidate==='object' && (candidate.program||candidate.days))return candidate;
    }catch(_){}
    break;
   }
  }
 }
 return null;
}
function extractProgramObject(input){
 const raw=String(input||'').replace(/^\uFEFF/,'').trim();
 if(!raw)throw Error('Non hai incollato alcuna scheda.');
 const normalized=fixCopiedJSONBrackets(raw);
 // Prima accetta il JSON integro, poi una risposta AI con introduzioni / markdown.
 for(const source of [raw,...(normalized.fixes?[normalized.text]:[])]){
  try{
   const item=JSON.parse(source);
   if(item && typeof item==='object' && (item.program||item.days))return item;
  }catch(_){}
  const extracted=findProgramJSON(source);
  if(extracted)return extracted;
 }
 if(/"schemaVersion"|"program"|"exercises"/.test(raw)){
  throw Error('Il testo contiene una scheda JSON ma non è completo o contiene altri caratteri non validi. Verifica di aver copiato dall’inizio alla fine; puoi anche importare un file .json.');
 }
 throw Error('Non ho trovato una scheda JSON completa. Incolla l’intera risposta o usa il formato testuale guidato.');
}
function readProgramInput(txt){
 const raw=String(txt||'').trim();
 if(!raw)throw Error('Incolla la scheda prima di continuare.');
 try{return extractProgramObject(raw);}catch(err){
  if(/^\s*#\s*.+/m.test(raw)&&/^.+\|\s*\d+\s*[x×]\s*\d+/m.test(raw))return parseGuidedWorkoutText(raw);
  throw err;
 }
}
async function importProgramText(txt, onSuccess){
  try{
    const obj=readProgramInput(txt);
    const checkedDays=validateProgram(obj,true);
    const p=getProfile();
    const declared=Array.isArray(p.trainingWeekdays)?p.trainingWeekdays.map(Number):null;
    if(declared && p.scheduleMode!=="flexible"){
      const imported=checkedDays.map(d=>d.weekday).filter(Boolean);
      const mismatch=declared.length!==checkedDays.length || imported.length!==checkedDays.length || imported.some(x=>!declared.includes(x));
      if(mismatch && !confirm(`I giorni della scheda non coincidono con quelli scelti nel profilo. Profilo: ${declared.join(", ")} (1=lun ... 7=dom); scheda: ${imported.length?imported.join(", "):"non specificati"}. Importare comunque?`))return;
    }
    const name=String((obj.program||obj).name||"Scheda personalizzata");
    const dayNames=["","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
    const total=checkedDays.reduce((n,d)=>n+d.ex.length,0);
    const blocks=checkedDays.map(d=>`<div class="preview-day"><b>${safe(dayNames[d.weekday]||d.title)} · ${safe(d.title)}</b><small>${d.ex.length} esercizi · ${d.ex.reduce((n,e)=>n+e.sets,0)} serie</small><small>${d.ex.map(e=>`${safe(e.name)} (${e.sets}×${safe(e.reps)}, ${fmt(e.rest)}, ${weightUnit(e)})`).join(" · ")}</small></div>`).join("");
    openSheet(`<h2>Anteprima della scheda</h2><div class="sub">${safe(name)} · ${checkedDays.length} giorni · ${total} esercizi. Controlla tutto prima di confermare.</div>${blocks}<p class="warn">L'importazione sostituirà la scheda attiva. Il vecchio storico non sarà cancellato, ma i nuovi esercizi avranno ID separati.</p><button class="big-btn primary" id="approveProgram">Conferma e importa</button><button class="big-btn" onclick="openSetupGuide(3)">Annulla</button>`);
    $("approveProgram").onclick=()=>{try{setProgram(obj);if(typeof onSuccess==="function")onSuccess();closeSheet();renderWelcome();showToast("Scheda importata correttamente");setActiveNav("workout");}catch(err){alert("Importazione non riuscita: "+err.message);}};
  }catch(e){alert("Impossibile importare la scheda: "+e.message+"\n\nPuoi incollare un JSON o usare il formato testuale guidato.");}
}

async function checkRelease(){try{const r=await fetch("version.json",{cache:"no-store"});if(!r.ok)return;const v=await r.json();if(typeof v.version!=="string"||!/^\d+\.\d+\.\d+$/.test(v.version))return;const a=v.version.split(".").map(Number),b=APP_VERSION.split(".").map(Number);const i=a.findIndex((x,j)=>x!==b[j]);if(i>=0&&a[i]>b[i]){remoteVersion=v.version;updateBanner();}}catch(_){}}
if("serviceWorker" in navigator){
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(updateAccepted)location.reload();});
 window.addEventListener("load",async()=>{try{updateRegistration=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});await updateRegistration.update();}catch(_){}checkRelease();});
}
window.addEventListener("focus",checkRelease);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkRelease();});
</script>
