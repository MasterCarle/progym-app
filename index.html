<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#161A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="proGYM">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>proGYM — Allenamento intelligente</title>
<style>
:root{
  --bg:#161A21;
  --surface:#1E242D;
  --surface-2:#252C37;
  --line:#2F3845;
  --text:#EAF0F7;
  --muted:#8A97A8;
  --accent:#F5A524;
  --accent-dim:#5a3f11;
  --heavy:#FF5C7A;
  --medium:#FF9F45;
  --light:#3ED598;
  --ok:#3ED598;
  --gold:#FFD166;
  --radius:14px;
  --tap:48px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Samsung Sans","Roboto",sans-serif;
  line-height:1.45;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
input,button,select{font-family:inherit;font-size:1rem;color:inherit}
button{background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- Topbar ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:rgba(22,26,33,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.bar h1{font-size:1rem;font-weight:650;margin:0;letter-spacing:.2px;flex:1}
.bar h1 span{display:block;font-size:.75rem;font-weight:450;color:var(--muted)}
.icon-btn{
  width:40px;height:40px;border-radius:12px;background:var(--surface);
  display:grid;place-items:center;font-size:1.05rem;border:1px solid var(--line);flex-shrink:0;
}
.days{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day-tab{
  flex:1 0 auto;min-width:74px;padding:9px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);
  font-size:.82rem;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap;
}
.day-tab b{display:block;font-size:.66rem;font-weight:500;opacity:.8}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#1a1205}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}

/* ---------- Toast ---------- */
.toast{
  position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;z-index:90;
  background:var(--gold);color:#241a02;font-weight:700;font-size:.85rem;
  padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transform:translate(-50%,-16px);transition:all .25s ease;
  box-shadow:0 8px 22px rgba(0,0,0,.45);white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Session strip ---------- */
.session{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
}
.session label{font-size:.72rem;color:var(--muted);display:block}
.session input[type=date]{
  background:transparent;border:none;padding:0;font-size:.95rem;font-weight:600;color:var(--text);
}
.session .count{text-align:right;font-size:.95rem;font-weight:700}
.session .count small{display:block;font-size:.7rem;font-weight:500;color:var(--muted)}

.note-day{
  margin:0 14px 14px;padding:12px 14px;border-radius:var(--radius);
  background:var(--accent-dim);border:1px solid #6d4f18;
  font-size:.84rem;color:#ffe2b0;
}

/* ---------- Exercise card ---------- */
.ex{
  margin:0 14px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
.ex.done{border-color:#2e5f4a}
.ex-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px}
.ex-head .t{flex:1;min-width:0}
.ex-name{font-size:.98rem;font-weight:650;line-height:1.25}
.ex-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:.76rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.dot.heavy{background:var(--heavy)}.dot.medium{background:var(--medium)}.dot.light{background:var(--light)}
.info-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:.85rem;font-weight:700;flex-shrink:0}
.tip{
  margin:0 14px 12px;padding:10px 12px;border-left:2px solid var(--accent);
  background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.82rem;color:#cfd8e3;display:none;
}
.tip.open{display:block}

.suggest{
  margin:0 14px 10px;padding:9px 12px;border-radius:10px;
  background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.35);
  font-size:.8rem;color:#ffcf82;display:flex;gap:7px;align-items:flex-start;
}
.suggest b{color:var(--accent);flex-shrink:0}

.variant-tag{font-size:.72rem;color:var(--accent);font-weight:600;margin-top:2px}
.variant-list{display:flex;flex-wrap:wrap;gap:8px}
.variant-chip{
  padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-size:.85rem;color:var(--text);font-weight:600;
}
.variant-chip.active{background:var(--accent);border-color:var(--accent);color:#1a1205}

.sets{padding:0 10px 10px}
.set-row{
  display:grid;grid-template-columns:26px 1fr 1fr var(--tap);
  gap:8px;align-items:center;padding:5px 4px;position:relative;
}
.set-head{
  display:grid;grid-template-columns:26px 1fr 1fr var(--tap);gap:8px;
  padding:2px 4px 6px;font-size:.68rem;color:var(--muted);
}
.set-n{font-size:.8rem;color:var(--muted);text-align:center;font-weight:600}
.fld{position:relative}
.fld input{
  width:100%;height:var(--tap);border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);padding:0 10px;font-size:1.05rem;font-weight:600;text-align:center;
}
.fld input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld input::placeholder{color:#5c6878;font-weight:500}
.chk{
  width:var(--tap);height:var(--tap);border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:#5c6878;position:relative;
}
.set-row.done .chk{background:var(--ok);border-color:var(--ok);color:#0d2a1e}
.set-row.done .fld input{opacity:.65}
.set-row.pr .fld input{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pr-star{position:absolute;top:-6px;left:-4px;font-size:.75rem}
.last{font-size:.68rem;color:var(--muted);padding:0 4px 8px;text-align:center;grid-column:1/-1}
.set-actions{display:flex;gap:8px;padding:4px 4px 6px}
.mini{
  flex:1;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
  font-size:.78rem;color:var(--muted);font-weight:600;
}

/* ---------- Profilo, feedback ---------- */
.feedback{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:5px 4px 10px}
.feedback label{font-size:.69rem;color:var(--muted)}
.feedback select,.profile-field input,.profile-field select{width:100%;min-height:42px;margin-top:5px;padding:7px 8px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:9px}
.profile-field{display:block;color:var(--muted);font-size:.8rem;margin:10px 0}
/* ---------- Coaching leggibile ---------- */
.previous-workout{margin:0 14px 10px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.previous-workout strong{font-size:.79rem;color:var(--accent)}
.previous-workout .line{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.previous-workout .pill{padding:5px 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:.8rem}
.previous-workout .muted{margin-top:7px;font-size:.73rem;color:var(--muted)}
.profile-days{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}
.profile-days label{display:flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:.8rem}
.profile-days input{accent-color:var(--accent)}
/* ---------- v2.2: mobile navigation / first start / guided setup ---------- */
body{padding-bottom:calc(155px + env(safe-area-inset-bottom))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(30,36,45,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bottom-nav button{min-height:53px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;color:var(--muted);font-size:.72rem}
.bottom-nav button span{font-size:1.15rem}
.bottom-nav button.active{color:var(--accent);background:rgba(245,165,36,.1)}
.timer{bottom:calc(80px + env(safe-area-inset-bottom))!important}
.welcome{margin:12px 14px;padding:16px;border-radius:16px;background:linear-gradient(145deg,#33311f,var(--surface));border:1px solid rgba(245,165,36,.4)}
.welcome h2{font-size:1.05rem;margin:0 0 6px}.welcome p{color:#cfd8e3;font-size:.82rem;margin:0 0 12px}.welcome button{background:var(--accent);padding:10px 14px;border-radius:10px;font-weight:700;color:#241a02}
.steps{display:flex;gap:7px;margin:12px 0 16px}.steps i{height:5px;flex:1;border-radius:5px;background:var(--line)}.steps i.on{background:var(--accent)}
.profile-field textarea{width:100%;min-height:80px;margin-top:5px;padding:9px 10px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:9px;resize:vertical}
.profile-field input[type=checkbox]{width:auto;min-height:0}
.preview-day{padding:10px;margin:8px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:.82rem}
.preview-day small{display:block;color:var(--muted);margin-top:4px}
.rest-detail{color:var(--muted);font-size:.72rem;padding:0 12px 8px}
/* ---------- Rest timer ---------- */
.timer{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
  background:var(--surface);border:1px solid var(--accent);border-radius:16px;
  padding:12px 14px;display:none;align-items:center;gap:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.timer.on{display:flex}
.timer .n{font-size:1.8rem;font-weight:700;letter-spacing:-.5px;min-width:86px}
.timer .lbl{flex:1;font-size:.78rem;color:var(--muted)}
.timer button{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.timer .ring{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.timer .ring i{display:block;height:100%;background:var(--accent)}

/* ---------- Sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:85vh;overflow-y:auto;
  background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:18px 16px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .22s ease;
}
.sheet.on{transform:translateY(0)}
.sheet h2{margin:0 0 4px;font-size:1.05rem}
.sheet .sub{color:var(--muted);font-size:.8rem;margin-bottom:14px}
.hist{border-top:1px solid var(--line);padding:11px 0}
.hist b{font-size:.82rem;font-weight:600}
.hist p{margin:4px 0 0;font-size:.85rem;color:#cfd8e3}
.hist .pr-tag{color:var(--gold);font-weight:700;font-size:.7rem;margin-left:6px}
.big-btn{
  width:100%;height:50px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);font-weight:600;margin-top:10px;
}
.big-btn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.big-btn.danger{color:#ff8b9e}
.empty{color:var(--muted);font-size:.85rem;padding:14px 0}
.warn{font-size:.75rem;color:var(--muted);margin-top:14px;line-height:1.5}

/* ---------- Chart ---------- */
.chart-box{margin:6px 0 4px}
.chart{width:100%;height:90px;display:block}
.chart-range{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:2px}

/* ---------- Weekly stats ---------- */
.week-range{font-size:.78rem;color:var(--muted);margin-bottom:2px}
.mbar{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:10px;padding:8px 0}
.mlabel{font-size:.8rem;color:#cfd8e3}
.mtrack{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.mtrack i{display:block;height:100%;background:var(--accent);border-radius:6px}
.mval{font-size:.82rem;font-weight:700;text-align:right}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="t" style="flex:1">
      <h1 id="dayTitle">—<span id="daySub">—</span></h1>
    </div>
    <button class="icon-btn" id="btnProgram" aria-label="Gestione programma" style="display:none">⇄</button>
    <button class="icon-btn" id="btnProfile" aria-label="Profilo atleta" style="display:none">👤</button>
    <button class="icon-btn" id="btnWeekly" aria-label="Statistiche settimanali" style="display:none">📊</button>
    <button class="icon-btn" id="btnSettings" aria-label="Impostazioni">⚙</button>
  </div>
  <div class="days" id="days"></div>
  <div class="progress"><i id="progBar"></i></div>
</header>

<div class="toast" id="toast"></div>

<div class="session">
  <div>
    <label for="dateInput">Allenamento del</label>
    <input type="date" id="dateInput">
  </div>
  <div class="count"><span id="doneCount" class="num">0/0</span><small>serie completate</small></div>
</div>

<div id="welcomeBox"></div>
<div id="dayNote"></div>
<main id="list"></main>

<div class="timer" id="timer">
  <div>
    <div class="n num" id="timerNum">0:00</div>
    <div class="ring"><i id="timerRing"></i></div>
  </div>
  <div class="lbl" id="timerLbl">Recupero</div>
  <button id="timerAdd">+30s</button>
  <button id="timerStop">Stop</button>
</div>

<nav class="bottom-nav" aria-label="Navigazione principale">
  <button data-nav="workout" class="active"><span>🏋</span>Allenati</button>
  <button data-nav="program"><span>📋</span>Scheda</button>
  <button data-nav="stats"><span>📊</span>Progressi</button>
  <button data-nav="profile"><span>👤</span>Profilo</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script>
/* =========================================================
   1. LA SCHEDA
   muscle: gruppo muscolare usato per il riepilogo settimanale
   ========================================================= */
// Un'installazione nuova non ha alcuna scheda preimpostata.
// Ogni utente importa la propria scheda (o la crea tramite AI).
let PROGRAM = [];
const MUSCLES = ["Petto","Dorso","Spalle","Bicipiti","Tricipiti","Quadricipiti","Femorali","Adduttori","Polpacci","Core","Collo"];
let MUSCLE_OF = {};

function rebuildMuscles(){ MUSCLE_OF = {}; PROGRAM.forEach(d => d.ex.forEach(e => MUSCLE_OF[e.id] = e.muscle)); }
rebuildMuscles();

/* =========================================================
   2. STORAGE
   ========================================================= */
const KEY = "palestra_v1";
const TKEY = "palestra_timer_v1";
const PKEY = "palestra_program_v2";
const PROFILE_KEY = "palestra_profile_v2";
const Store = (() => {
  let mem = null, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    load(){
      if(mem) return mem;
      try{ mem = JSON.parse(localStorage.getItem(KEY)) || {sessions:{}}; }
      catch(e){ mem = {sessions:{}}; }
      if(!mem.sessions) mem.sessions = {};
      return mem;
    },
    save(){ if(!ok) return; try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
    ,replace(obj){ mem = obj; this.save(); }
  };
})();

/* =========================================================
   3. STATO
   ========================================================= */
const todayISO = () => new Date().toISOString().slice(0,10);
let state = { dayId: guessDay(), date: todayISO() };
function safe(text){ return String(text ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeAttr(text){ return safe(text); }
function getProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}}catch(e){return {}}}
const REST_OVERRIDES_KEY="palestra_rest_overrides_v22";
function getRestOverrides(){try{return JSON.parse(localStorage.getItem(REST_OVERRIDES_KEY))||{}}catch(e){return {}}}
function effectiveRest(ex){
  const overrides=getRestOverrides();
  if(Number.isInteger(overrides[ex.id]) && overrides[ex.id]>=15 && overrides[ex.id]<=600)return overrides[ex.id];
  const p=getProfile();
  if(p.restMode==="global"){
    const sec=Number(p.defaultRestSeconds);
    if(Number.isInteger(sec)&&sec>=15&&sec<=600)return sec;
  }
  return ex.rest;
}
function editExerciseRest(exId){
  const ex=day().ex.find(x=>x.id===exId);if(!ex)return;
  const overrides=getRestOverrides();
  const own=Object.prototype.hasOwnProperty.call(overrides,ex.id);
  const p=getProfile();
  openSheet(`<h2>Recupero · ${safe(ex.name)}</h2><div class="sub">Programma: ${fmt(ex.rest)} · ${p.restMode==="global"?`Predefinito personale: ${fmt(Number(p.defaultRestSeconds)||180)}`:"Predefinito: scheda importata"}.</div>
    <label class="profile-field">Recupero tra le serie (secondi)<input type="number" id="restExerciseValue" min="15" max="600" step="15" value="${effectiveRest(ex)}"></label>
    <p class="warn">Questa modifica si applica solo a questo esercizio nelle prossime sedute. Il recupero parte quando completi una serie.</p>
    <button class="big-btn primary" id="saveExerciseRest">Salva recupero</button>
    <button class="big-btn" id="resetExerciseRest">Ripristina tempo predefinito ${own?"(annulla modifica)":""}</button>
    <button class="big-btn" onclick="closeSheet()">Annulla</button>`);
  $("saveExerciseRest").onclick=()=>{const v=Number($("restExerciseValue").value);if(!Number.isInteger(v)||v<15||v>600){alert("Inserisci un recupero tra 15 e 600 secondi.");return;}overrides[ex.id]=v;localStorage.setItem(REST_OVERRIDES_KEY,JSON.stringify(overrides));closeSheet();renderList();showToast("Recupero aggiornato");};
  $("resetExerciseRest").onclick=()=>{delete overrides[ex.id];localStorage.setItem(REST_OVERRIDES_KEY,JSON.stringify(overrides));closeSheet();renderList();};
}
function loadProgram(){
  try {
    const obj = JSON.parse(localStorage.getItem(PKEY));
    if(obj){ PROGRAM = validateProgram(obj, false); window.ACTIVE_PROGRAM_NAME=String(obj.program?.name||"Scheda personalizzata").slice(0,80); }
  } catch(err){ console.warn("Programma personalizzato ignorato:", err); }
  rebuildMuscles();
}
function saveProgram(){localStorage.setItem(PKEY,JSON.stringify({schemaVersion:"1.0",program:{name:programName(),days:PROGRAM}}));}
function programName(){return window.ACTIVE_PROGRAM_NAME || "Nessuna scheda caricata";}
function setProgram(obj){
  const clean = validateProgram(obj, true);
  const name = String((obj.program && obj.program.name)||obj.name||"Scheda personalizzata").slice(0,80);
  // Identificativi diversi per ogni importazione: nessuna attribuzione erronea dello storico.
  const sessions=Object.values(Store.load().sessions||{});
  const historicalIds=new Set(sessions.flatMap(s=>Object.keys(s||{})));
  const matches=clean.flatMap(d=>d.ex).filter(e=>historicalIds.has(e.id)).length;
  // Ripristino esplicito per i vecchi utenti: mantiene gli ID solo con una corrispondenza storica reale.
  const restoreIds = obj.program?.restoreExistingIds===true && matches>=2;
  if(obj.program?.manualEdit===true){
    // L'editor mantiene gli ID degli esercizi non modificati per preservare i confronti storici.
    const previous=new Map(PROGRAM.flatMap(d=>d.ex.map(e=>[e.id,e.name])));
    const knownDays=new Set(PROGRAM.map(d=>d.id));
    const seed='manual'+Date.now().toString(36)+'_';let seq=0;
    const seen=new Set();
    clean.forEach(d=>{if(!knownDays.has(d.id))d.id=seed+'d'+(seq++);
      d.ex.forEach(e=>{
        if(previous.get(e.id)!==e.name || seen.has(e.id))e.id=seed+'e'+(seq++);
        seen.add(e.id);
      });
    });
  }else if(!restoreIds){
    const prefix = "imp" + Date.now().toString(36) + "_";
    clean.forEach((d,i)=>{d.id=prefix+"d"+i; d.ex.forEach((e,j)=>e.id=prefix+"e"+i+"_"+j);});
  }
  PROGRAM=clean; window.ACTIVE_PROGRAM_NAME=name;
  saveProgram(); rebuildMuscles(); state.dayId=PROGRAM[0].id; renderDays(); renderList();
}
const MUSCLE_OPTIONS = ["Petto","Dorso","Spalle","Bicipiti","Tricipiti","Quadricipiti","Femorali","Glutei","Adduttori","Polpacci","Core","Collo","Altro"];
function validateProgram(obj, rejectEmpty){

      const sets = Number(e.sets), rest = Number(e.restSeconds ?? e.rest ?? 180);
      let reps = e.reps;
      if(reps && typeof reps === "object") reps = `${reps.min}-${reps.max}`;
      reps = String(reps ?? "8-12");

      const nums = reps.split("-").map(Number);
      if(nums[0]<1 || nums[nums.length-1]>100 || nums[0]>nums[nums.length-1]) throw Error(name+": range ripetizioni non valido.");
      if(!Number.isInteger(rest)||rest<15||rest>600) throw Error(name+": recupero non valido.");

      return { id:/^[a-zA-Z0-9_-]{1,90}$/.test(String(e.id||""))?String(e.id):`d${i}e${j}`, name, sets, reps, rest, muscle, rir, load:["heavy","medium","light"].includes(e.load)?e.load:"medium",loadTxt:"Personalizzato", tip:String(e.tip||e.notes||`RIR ${rir}. Mantieni una tecnica controllata.`).slice(0,500),bw:Boolean(e.bw),variants:Array.isArray(e.variants)?e.variants.filter(v=>typeof v==="string").slice(0,8).map(v=>v.slice(0,90)):[]};

  });
  if(count>130) throw Error("Troppi esercizi nella scheda.");

function ageFromDOB(dob){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dob||"")) return null;
  const born=new Date(dob+"T12:00:00"),now=new Date();
  if(Number.isNaN(born.getTime()) || born>now || born.getFullYear()<1900 || born.toISOString().slice(0,10)!==dob) return null;
  let age=now.getFullYear()-born.getFullYear();
  if((now.getMonth()<born.getMonth()) || (now.getMonth()===born.getMonth() && now.getDate()<born.getDate()))age--;
  return age;
}

const sessionKey = (date=state.date, dayId=state.dayId) => date + "__" + dayId;

function session(create=false){
  const db = Store.load();
  const k = sessionKey();
  if(!db.sessions[k] && create) db.sessions[k] = {};
  return db.sessions[k] || {};
}
// Normalizza i dati "vecchio formato" (array di serie) in {variant, sets}
function normalizeRaw(ex, raw){
  if(!raw) return null;
  if(Array.isArray(raw)) return {variant: ex.name, sets: raw};
  return raw;
}
// Ritorna {variant, sets} per l'esercizio nella sessione corrente
function exEntry(ex, create=false){
  const s = session(create);
  let raw = normalizeRaw(ex, s[ex.id]);
  if(!raw && create){
    raw = {variant: ex.name, muscle:ex.muscle, sets: Array.from({length:ex.sets}, () => ({w:"",r:"",d:false}))};
  }
  if(raw && create) s[ex.id] = raw;
  return raw;
}
function lastPerformance(ex, variant){
  const db = Store.load();
  const keys = Object.keys(db.sessions)
    .filter(k => k !== sessionKey() && k.split("__")[0] < state.date)
    .filter(k => {
      const raw = normalizeRaw(ex, db.sessions[k][ex.id]);
      return raw && raw.variant === variant && raw.sets.some(s => s.d || s.w || s.r);
    })
    .sort().reverse();
  if(!keys.length) return null;
  const raw = normalizeRaw(ex, db.sessions[keys[0]][ex.id]);
  return { date: keys[0].split("__")[0], sets: raw.sets };
}
function bestWeightBefore(ex, variant){
  const db = Store.load();
  const curKey = sessionKey();
  let best = null;
  Object.keys(db.sessions).forEach(k => {
    if(k === curKey) return;
    const raw = normalizeRaw(ex, db.sessions[k][ex.id]);
    if(!raw || raw.variant !== variant) return;
    raw.sets.forEach(set => {
      const w = parseFloat(set.w);
      if(set.d && !isNaN(w) && (best === null || w > best)) best = w;
    });
  });

/* ---------- Progressione suggerita ---------- */
function parseRepRange(reps){
  const clean = reps.replace("s","");
  const parts = clean.split("-").map(Number);
  return parts.length === 2 ? parts : [parts[0], parts[0]];
}
function roundHalf(n){ return Math.round(n*2)/2; }
function previousWorkoutBox(ex,variant){
  const last=lastPerformance(ex,variant);
  if(!last)return "";
  const sets=last.sets.filter(s=>s.d && s.r!=="" && s.r!=null);
  if(!sets.length)return "";
  const items=sets.map((s,i)=>`<span class="pill">${i+1}ª: <b>${safe(s.r)} rip.</b>${ex.bw ? (Number(s.w)>0?" · +"+safe(s.w)+" kg":" · corpo libero") : (s.w!==""?" · "+safe(s.w)+" kg":"")}</span>`).join("");
  return `<div class="previous-workout"><strong>ULTIMA VOLTA · ${dmy(last.date)}</strong><div class="line">${items}</div><div class="muted">Questi valori sono lo storico registrato, non obiettivi ancora da completare.</div></div>`;
}
function suggestion(ex,variant){
  if(ex.unit==="sec")return null;
  const last=lastPerformance(ex,variant);
  if(!last)return "Registra una seduta completa per ricevere un consiglio basato sui tuoi dati.";
  const completed=last.sets.filter(s=>s.d && s.r!=="" && Number.isFinite(Number(s.r)));
  if(!completed.length)return "Mancano ripetizioni registrate nella seduta precedente: completa il diario per avere consigli.";
  const [min,max]=parseRepRange(ex.reps);
  const reps=completed.map(s=>Number(s.r));
  const weightValues=completed.map(s=>s.w===""?null:Number(s.w));
  const hasWeights=weightValues.every(v=>v!==null && Number.isFinite(v));
  const sameLoad=hasWeights && weightValues.every(v=>v===weightValues[0]);
  const total=reps.reduce((a,b)=>a+b,0);
  const commonLoad=sameLoad ? weightValues[0] : null;
  const loadText=ex.bw?(commonLoad>0?`+${commonLoad} kg di zavorra`:`il corpo libero`):commonLoad!==null?`${commonLoad} kg`:`il carico precedente`;
  if(completed.length!==ex.sets)return `Hai registrato ${completed.length} serie su ${ex.sets} previste. <b>Ripeti il carico e completa il programma</b> prima di aumentarlo.`;
  if(!sameLoad && !ex.bw)return `L'ultima seduta contiene carichi diversi o mancanti: <b>consolida le serie</b> e confronta tecnica e ripetizioni; nessun aumento automatico.`;
  if(reps.some(n=>n<min))return `Ultima seduta: ${reps.join(" / ")} rip. (totale ${total}), almeno una serie sotto ${min}. <b>Consolida ${loadText}</b> o riducilo se la tecnica peggiora.`;
  if(reps.every(n=>n>=max))return `Ultima seduta: ${reps.join(" / ")} rip. (totale ${total}). <b>Valuta un piccolo incremento di carico</b> solo se tutte le serie erano controllate e con margine sufficiente.`;
  const target=[...reps];
  for(let i=target.length-1;i>=0;i--){if(target[i]<max){target[i]++;break;}}
  return `Ultima seduta: <b>${reps.join(" / ")} rip.</b> (totale ${total}). Oggi mantieni <b>${loadText}</b> e prova <b>${target.join(" / ")}</b> (totale ${total+1}). Se la giornata è più faticosa, ripetere i risultati precedenti va bene.`;
}

function toggleSet(row){
  const ex = day().ex.find(x => x.id === row.dataset.ex);
  const entry = exEntry(ex, true);
  const rows = entry.sets;
  const i = +row.dataset.i;
  const s = rows[i];
  s.d = !s.d;

  if(s.d){
    if(!s.w && !s.r){
      const prev = rows.slice(0,i).reverse().find(x => x.w || x.r);
      const last = lastPerformance(ex, entry.variant);
      const src = prev || (last && last.sets[i]) || null;
      if(src){ s.w = src.w || ""; s.r = src.r || ""; }

/* ---------- Timer di recupero: basato su timestamp reale, sopravvive a schermo spento ---------- */
let t = { endTime:null, total:0, label:"", id:null };
let wakeLock = null;

function persistTimer(){
  try{
    if(t.endTime) localStorage.setItem(TKEY, JSON.stringify({endTime:t.endTime, total:t.total, label:t.label}));
    else localStorage.removeItem(TKEY);
  }catch(e){}
}
async function requestWakeLock(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
}
function startTimer(sec, label){
  t.endTime = Date.now() + sec*1000;
  t.total = sec;
  t.label = label;
  persistTimer();
  $("timerLbl").textContent = "Recupero · " + label;
  $("timer").classList.add("on");
  requestWakeLock();
  clearInterval(t.id);
  tick();
  t.id = setInterval(tick, 250);
}
function tick(){
  if(!t.endTime) return;
  const left = Math.max(0, Math.round((t.endTime - Date.now())/1000));
  $("timerNum").textContent = fmt(left);
  $("timerRing").style.width = (left/t.total*100) + "%";
  if(left <= 0) endTimer();
}
function endTimer(){
  clearInterval(t.id);
  t.endTime = null;
  persistTimer();
  releaseWakeLock();
  beep();
  if(navigator.vibrate) navigator.vibrate([250,120,250]);
  setTimeout(() => $("timer").classList.remove("on"), 4000);
}
function stopTimer(){
  clearInterval(t.id);
  t.endTime = null;
  persistTimer();
  releaseWakeLock();
  $("timer").classList.remove("on");
}
$("timerStop").onclick = stopTimer;
$("timerAdd").onclick = () => {
  if(!t.endTime) return;
  t.endTime += 30000;
  t.total = Math.max(t.total, Math.round((t.endTime - Date.now())/1000));
  persistTimer();
  tick();
};
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && t.endTime){
    tick();
    if(!wakeLock) requestWakeLock();
  }
});
// resume da localStorage se la pagina viene ricaricata mentre il timer era attivo
(function resumeTimer(){
  try{
    const raw = localStorage.getItem(TKEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.endTime && saved.endTime > Date.now()){
      t.endTime = saved.endTime; t.total = saved.total; t.label = saved.label;
      $("timerLbl").textContent = "Recupero · " + saved.label;
      $("timer").classList.add("on");
      requestWakeLock();
      clearInterval(t.id);
      tick();
      t.id = setInterval(tick, 250);
    } else {
      localStorage.removeItem(TKEY);
    }
  }catch(e){}
})();

let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,.28,.56].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, actx.currentTime+d);
      g.gain.exponentialRampToValueAtTime(.35, actx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d+.2);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.22);
    });
  }catch(e){}
}

function buildChart(points){
  if(points.length < 2) return "";
  const w=280, h=90, pad=10;
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = (w - 2*pad) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((p.value - min)/range) * (h - 2*pad);
    return [x.toFixed(1), y.toFixed(1)];
  });
  const line = coords.map(c => c.join(",")).join(" ");
  const dots = coords.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="var(--accent)"/>`).join("");
  return `<div class="chart-box">
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:4px">Andamento carico</div>

function openHistory(exId){
  const ex = day().ex.find(x => x.id === exId);
  const db = Store.load();
  const entries = Object.keys(db.sessions)
    .map(k => ({k, raw: normalizeRaw(ex, db.sessions[k][exId])}))
    .filter(x => x.raw && x.raw.sets.some(s => s.w || s.r))
    .sort((a,b) => a.k.localeCompare(b.k));

  const todayEntry = exEntry(ex);
  const refVariant = todayEntry ? todayEntry.variant : ex.name;

  const chartPoints = entries.filter(x => x.raw.variant === refVariant).map(x => {
    const weights = x.raw.sets.map(s => parseFloat(s.w)).filter(n => !isNaN(n));
    return weights.length ? {date:x.k.split("__")[0], value: Math.max(...weights)} : null;
  }).filter(Boolean);

  const rows = entries.slice().reverse().slice(0,12).map(x => {
    const sets = x.raw.sets.filter(s => s.w || s.r);
    const weights = sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
    const topW = weights.length ? Math.max(...weights) : null;
    const date = x.k.split("__")[0];
    let isPR = false;
    if(topW !== null && x.raw.variant === refVariant){
      const bestSoFar = Math.max(...chartPoints.filter(p=>p.date<=date).map(p=>p.value), -Infinity);
      isPR = topW === bestSoFar && chartPoints.find(p=>p.value===topW)?.date === date;
    }
    const setsTxt = sets.map(s => `${s.w||"–"}×${s.r||"–"}`).join("  ·  ");
    const vol = x.raw.sets.reduce((a,s)=> a + (parseFloat(s.w)||0)*(parseFloat(s.r)||0), 0);
    const variantTag = x.raw.variant !== ex.name ? `<span class="pr-tag" style="color:var(--muted)">· ${safe(x.raw.variant)}</span>` : "";
    return `<div class="hist"><b>${date.split("-").reverse().join("/")}</b>${isPR?'<span class="pr-tag">🏆 PR</span>':''}${variantTag}
            <p>${safe(setsTxt)}${vol?`  <span style="color:var(--muted)">· volume ${Math.round(vol)} kg</span>`:""}</p></div>`;
  }).join("");

  openSheet(`<h2>${safe(ex.name)}</h2><div class="sub">Ultimi allenamenti registrati${refVariant!==ex.name?` · grafico su "${refVariant}"`:""}</div>
    ${buildChart(chartPoints)}
    ${rows || '<div class="empty">Nessun dato ancora. Compila i campi e spunta le serie: da qui in poi vedrai i progressi.</div>'}
    <button class="big-btn" onclick="closeSheet()">Chiudi</button>`);
}

function applyVariant(exId, variantName, newMuscle){
  const ex = day().ex.find(x => x.id === exId);

function isoWeekRange(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const offset = (d.getDay() + 6) % 7; // lunedì = 0
  const monday = new Date(d); monday.setDate(d.getDate() - offset);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return [monday.toISOString().slice(0,10), sunday.toISOString().slice(0,10)];
}
function weeklySets(dateStr){
  const [start,end] = isoWeekRange(dateStr);
  const db = Store.load();
  const totals = {}; [...new Set([...MUSCLES,...MUSCLE_OPTIONS])].forEach(m => totals[m] = 0);
  Object.keys(db.sessions).forEach(k => {
    const date = k.split("__")[0];
    if(date < start || date > end) return;
    const s = db.sessions[k];
    Object.keys(s).forEach(exId => {
      const muscle = (s[exId] && !Array.isArray(s[exId]) && s[exId].muscle) || MUSCLE_OF[exId];
      if(!muscle) return;
      if(!(muscle in totals)) totals[muscle]=0;
      const raw = s[exId];
      const setsArr = Array.isArray(raw) ? raw : (raw && raw.sets) || [];
      totals[muscle] += setsArr.filter(x => x.d).length;
    });
  });
  return {start, end, totals};
}
$("btnWeekly").onclick = () => {

      <span class="mval num">${totals[m]}</span>
    </div>`).join("");
  const hasData = Object.values(totals).some(v => v > 0);
  openSheet(`<h2>Serie della settimana</h2>
    <div class="week-range">${dmy(start)} – ${dmy(end)}</div>
    <div style="margin-top:10px">${hasData ? bars : '<div class="empty">Nessuna serie completata questa settimana.</div>'}</div>
    <button class="big-btn" onclick="closeSheet()">Chiudi</button>`);
};

function buildMarkdownExport(){
  let md = `# Scheda Palestra\n\n`;
  PROGRAM.forEach(d => {
    md += `## ${d.title} — ${d.sub}\n\n`;
    if(d.note) md += `> ${d.note}\n\n`;
    md += `| Esercizio | Serie × Reps | Carico | Recupero | Indicazione |\n|---|---|---|---|---|\n`;
    d.ex.forEach(ex => {
      const variants = ex.variants && ex.variants.length ? ` (varianti: ${ex.variants.join(", ")})` : "";
      const note = ex.tip.replace(/\|/g, "-");
      md += `| ${ex.name}${variants} | ${ex.sets}×${ex.reps} | ${ex.loadTxt} | ${fmt(ex.rest)} | ${note} |\n`;
    });
    md += "\n";
  });
  return md;
}
function exportMarkdown(){
  if(!PROGRAM.length){alert("Nessuna scheda disponibile: importa prima il tuo programma.");return;}
  const md = buildMarkdownExport();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(md).then(() => showToast("Markdown copiato negli appunti")).catch(() => {});
  }
  const blob = new Blob([md], {type:"text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scheda-palestra.md";
  a.click();
}

function exportData(){
  const blob = new Blob([JSON.stringify({sessions:Store.load().sessions,profile:getProfile(),restOverrides:getRestOverrides(),activeProgram:localStorage.getItem(PKEY)?JSON.parse(localStorage.getItem(PKEY)):null})], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "palestra-backup-" + todayISO() + ".json";
  a.click();
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const obj = JSON.parse(rd.result);
        if(!obj.sessions) throw 0;
        const cur = Store.load();
        Store.replace({sessions: Object.assign({}, cur.sessions, obj.sessions)});
        if(obj.profile && typeof obj.profile==="object") localStorage.setItem(PROFILE_KEY,JSON.stringify(obj.profile));
        if(obj.restOverrides && typeof obj.restOverrides==="object") localStorage.setItem(REST_OVERRIDES_KEY,JSON.stringify(obj.restOverrides));
        if(obj.activeProgram){validateProgram(obj.activeProgram,true); localStorage.setItem(PKEY,JSON.stringify(obj.activeProgram)); loadProgram();state.dayId=PROGRAM[0].id;renderDays();}
        closeSheet(); renderDays();renderList();renderWelcome();
      }catch(e){ alert("File non valido: serve un backup creato da questa app."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetDay(){
  if(!confirm("Azzeri i dati di " + dmy(state.date) + "?")) return;
  const db = Store.load();
  delete db.sessions[sessionKey()];
  Store.save(); closeSheet(); renderList();
}
function wipe(){
  if(!confirm("Cancelli tutto lo storico? L'operazione non è reversibile.")) return;
  Store.replace({sessions:{}});
  closeSheet(); renderList();
}

    <label class="profile-field">Attrezzatura disponibile<select id="pf_equipment">${["Palestra completa","Palestra essenziale","Home gym","Corpo libero"].map(x=>`<option ${x===(p.equipment||"Palestra completa")?"selected":""}>${x}</option>`).join("")}</select></label>
    <label class="profile-field">Esercizi preferiti o da evitare<textarea id="pf_preferences" maxlength="500" placeholder="Es. preferisco macchinari, non voglio squat libero">${safe(p.preferences||"")}</textarea></label>
    <div class="profile-field">Giorni disponibili per allenarti <span style="color:var(--muted)">(seleziona quelli abituali)</span><div class="profile-days">${dayNames.map((d,i)=>`<label><input type="checkbox" data-training-weekday="${i+1}" ${selected.includes(i+1)?"checked":""}> ${d}</label>`).join("")}</div></div>
    <label class="profile-field">Recupero tra le serie: come preferisci gestirlo?
      <select id="pf_restMode">
        <option value="program" ${p.restMode!=="global"?"selected":""}>Usa i tempi della scheda importata</option>
        <option value="global" ${p.restMode==="global"?"selected":""}>Usa il mio tempo predefinito per tutti</option>
      </select>
    </label>
    <label class="profile-field">Tempo predefinito (secondi, 15–600)<input id="pf_defaultRestSeconds" type="number" min="15" max="600" step="15" value="${safeAttr(p.defaultRestSeconds||180)}"></label>
    <p class="warn">Puoi comunque cambiare il recupero di ogni esercizio dal pulsante ⏱ Recupero. Le modifiche specifiche prevalgono sul tempo predefinito.</p>
    ${field("Preferenze e limitazioni (facoltativo)","limitations")}
    <p class="warn">I giorni del profilo descrivono la tua disponibilità: <b>non modificano automaticamente la scheda</b>. Importa una scheda con lo stesso numero di giornate e i rispettivi weekday. Non inserire dati sanitari sensibili se non desideri conservarli sul telefono.</p>
    <button class="big-btn primary" id="saveProfile">Salva profilo</button><button class="big-btn" onclick="closeSheet()">Annulla</button>`);
  $("pf_birthDate").addEventListener("input",e=>{const a=ageFromDOB(e.target.value);$("agePreview").textContent=a===null?"Inserisci una data di nascita valida e non futura.":`Età attuale: ${a} anni.`;});
  $("saveProfile").onclick=()=>{
    const vals={};["nickname","birthDate","height","weight","sex","goal","priority","experience","limitations"].forEach(k=>vals[k]=String($("pf_"+k).value).slice(0,100));
    if(vals.birthDate && ageFromDOB(vals.birthDate)===null){alert("Data di nascita non valida.");return;}
    vals.goalDetails=$("pf_goalDetails").value.slice(0,500);
    vals.preferences=$("pf_preferences").value.slice(0,500);
    vals.durationMinutes=Number($("pf_durationMinutes").value);
    vals.equipment=$("pf_equipment").value;
    vals.restMode=$("pf_restMode").value;
    vals.defaultRestSeconds=Number($("pf_defaultRestSeconds").value);
    if(!Number.isInteger(vals.defaultRestSeconds)||vals.defaultRestSeconds<15||vals.defaultRestSeconds>600){alert("Recupero predefinito: tra 15 e 600 secondi.");return;}
    if(!Number.isInteger(vals.durationMinutes)||vals.durationMinutes<20||vals.durationMinutes>240){alert("Durata: indica un valore tra 20 e 240 minuti.");return;}
    vals.trainingWeekdays=Array.from(document.querySelectorAll("[data-training-weekday]:checked")).map(e=>Number(e.dataset.trainingWeekday));
    if(!vals.trainingWeekdays.length){alert("Seleziona almeno un giorno di allenamento.");return;}
    vals.days=String(vals.trainingWeekdays.length);
    try{localStorage.setItem(PROFILE_KEY,JSON.stringify(vals));showToast("Profilo salvato");closeSheet();renderWelcome();renderList();if(fromGuide===true)openSetupGuide(2);}catch(e){alert("Impossibile salvare il profilo: "+e.message);}
  };
}


/* ---------- v2.4: creazione schede senza AI ---------- */
const MANUAL_DRAFT_KEY="progym_manual_draft_v24";
const WEEKDAYS=["","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
let manualDraft=null;
function blankManualDay(weekday=1){return {name:WEEKDAYS[weekday]+' · Allenamento',weekday,exercises:[]};}
function blankManualExercise(){const p=getProfile();return {name:"",sets:3,reps:"8-12",restSeconds:Number(p.defaultRestSeconds)||180,muscle:"Altro",notes:""};}
function openManualBuilder(){
 try{manualDraft=JSON.parse(localStorage.getItem(MANUAL_DRAFT_KEY));}catch(_){manualDraft=null;}
 if(!manualDraft){
  if(PROGRAM.length){
   manualDraft={name:programName(),days:PROGRAM.map(d=>({id:d.id,name:d.title,weekday:d.weekday,exercises:d.ex.map(e=>({id:e.id,name:e.name,sets:e.sets,reps:e.reps,restSeconds:e.rest,muscle:e.muscle,notes:e.tip||""}))}))};
  }else{const p=getProfile();const wd=p.trainingWeekdays?.[0]||1;manualDraft={name:"La mia scheda",days:[blankManualDay(wd)]};}
 }
 renderManualBuilder();
}
function persistManual(){try{localStorage.setItem(MANUAL_DRAFT_KEY,JSON.stringify(manualDraft));}catch(_){}}
function captureManual(){
 if(!manualDraft)return;
 const title=document.getElementById('mbName');if(!title)return;
 manualDraft.name=title.value.trim().slice(0,80);
 document.querySelectorAll('[data-mb-day]').forEach(node=>{
  const i=Number(node.dataset.mbDay),d=manualDraft.days[i];if(!d)return;
  d.name=node.querySelector('[data-mb-name]').value.slice(0,85);
  d.weekday=Number(node.querySelector('[data-mb-weekday]').value);
  node.querySelectorAll('[data-mb-ex]').forEach(en=>{
   const j=Number(en.dataset.mbEx),e=d.exercises[j];if(!e)return;
   e.name=en.querySelector('[data-mb-exname]').value.slice(0,110);
   e.sets=Number(en.querySelector('[data-mb-sets]').value);
   e.reps=en.querySelector('[data-mb-reps]').value.trim();
   e.restSeconds=Number(en.querySelector('[data-mb-rest]').value);
   e.muscle=en.querySelector('[data-mb-muscle]').value;
   e.notes=en.querySelector('[data-mb-notes]').value.slice(0,500);
  });
 });persistManual();
}
function renderManualBuilder(){
 const wds=WEEKDAYS.map((x,i)=>i?`<option value="${i}">${x}</option>`:'').join('');
 const blocks=manualDraft.days.map((d,i)=>`<div class="preview-day" data-mb-day="${i}" style="margin-bottom:14px">
 <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><strong>Giornata ${i+1}</strong><button class="big-btn" style="width:auto;padding:9px" data-mb-remove-day="${i}">Rimuovi</button></div>
 <label class="profile-field">Nome giornata<input data-mb-name value="${safeAttr(d.name)}" placeholder="Es. Pull A"></label>
 <label class="profile-field">Giorno abituale<select data-mb-weekday>${wds}</select></label>
 ${d.exercises.map((e,j)=>`<div data-mb-ex="${j}" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:12px">
 <div style="display:flex;justify-content:space-between;align-items:center"><strong>Esercizio ${j+1}</strong><button class="big-btn" style="width:auto;padding:8px" data-mb-remove-ex="${i}:${j}">Elimina</button></div>
 <label class="profile-field">Nome esercizio<input data-mb-exname value="${safeAttr(e.name)}" placeholder="Es. Lat machine presa neutra"></label>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="profile-field">Serie<input type="number" min="1" max="10" data-mb-sets value="${e.sets}"></label><label class="profile-field">Ripetizioni<input data-mb-reps value="${safeAttr(e.reps)}" placeholder="8-12"></label></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="profile-field">Recupero (sec)<input type="number" min="15" max="600" step="15" data-mb-rest value="${e.restSeconds}"></label><label class="profile-field">Gruppo muscolare<select data-mb-muscle>${MUSCLE_OPTIONS.map(m=>`<option ${m===e.muscle?'selected':''}>${m}</option>`).join('')}</select></label></div>
 <label class="profile-field">Indicazioni (facoltative)<input data-mb-notes value="${safeAttr(e.notes||'')}" placeholder="Es. movimento controllato"></label>
 </div>`).join('')}
 <button class="big-btn" data-mb-add-ex="${i}">+ Aggiungi esercizio</button></div>`).join('');
 openSheet(`<h2>Scrivi la tua scheda</h2><div class="sub">Inserisci liberamente giorni ed esercizi. La bozza viene salvata sul dispositivo. Prima dell'attivazione vedrai l'anteprima.</div>
 <label class="profile-field">Nome programma<input id="mbName" value="${safeAttr(manualDraft.name)}" placeholder="La mia scheda"></label>${blocks}
 <button class="big-btn" id="mbAddDay">+ Aggiungi giornata</button>
 <button class="big-btn primary" id="mbReview">Controlla e salva scheda</button>
 <button class="big-btn" id="mbClose">Salva bozza ed esci</button>`);
 document.querySelectorAll('[data-mb-day]').forEach((el,i)=>el.querySelector('[data-mb-weekday]').value=String(manualDraft.days[i].weekday||i+1));
 document.querySelectorAll('[data-mb-add-ex]').forEach(b=>b.onclick=()=>{captureManual();const i=Number(b.dataset.mbAddEx);manualDraft.days[i].exercises.push(blankManualExercise());persistManual();renderManualBuilder();});
 document.querySelectorAll('[data-mb-remove-ex]').forEach(b=>b.onclick=()=>{captureManual();const [i,j]=b.dataset.mbRemoveEx.split(':').map(Number);manualDraft.days[i].exercises.splice(j,1);persistManual();renderManualBuilder();});
 document.querySelectorAll('[data-mb-remove-day]').forEach(b=>b.onclick=()=>{captureManual();if(manualDraft.days.length===1){alert('Serve almeno una giornata.');return;}manualDraft.days.splice(Number(b.dataset.mbRemoveDay),1);persistManual();renderManualBuilder();});
 $('mbAddDay').onclick=()=>{captureManual();if(manualDraft.days.length>=7){alert('Massimo 7 giornate.');return;}const used=new Set(manualDraft.days.map(d=>d.weekday));const next=[1,2,3,4,5,6,7].find(x=>!used.has(x));manualDraft.days.push(blankManualDay(next||1));persistManual();renderManualBuilder();};
 $('mbClose').onclick=()=>{captureManual();closeSheet();showToast('Bozza salvata');};
 $('mbReview').onclick=()=>{captureManual();try{const obj={schemaVersion:'1.0',program:{name:manualDraft.name||'La mia scheda',manualEdit:true,days:manualDraft.days.map(d=>({id:d.id,name:d.name,weekday:d.weekday,exercises:d.exercises}))}};validateProgram(obj,true);importProgramText(JSON.stringify(obj),()=>localStorage.removeItem(MANUAL_DRAFT_KEY));}catch(err){alert('Controlla la scheda: '+err.message);}};
}
function openTextProgram(){
 openSheet(`<h2>Incolla la scheda come testo</h2><div class="sub">Una riga per esercizio. Formato: <b>Nome esercizio | serie x ripetizioni | recupero in secondi | gruppo muscolare</b>.<p>Per separare i giorni scrivi una riga come <b># Lunedì - Pull</b>.</p></div>
 <textarea id="rawWorkoutText" rows="12" style="width:100%;padding:12px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px" placeholder="# Lunedì - Pull&#10;Lat machine | 3x8-12 | 180 | Dorso&#10;Rematore | 3x10 | 150 | Dorso&#10;# Giovedì - Gambe&#10;Leg press | 3x10-12 | 180 | Quadricipiti"></textarea>
 <p class="warn">Il riconoscimento è basato su un formato guidato, non sull'AI. Controlla sempre l'anteprima.</p>
 <button class="big-btn primary" id="parseWorkoutText">Controlla la scheda</button><button class="big-btn" onclick="openSetupGuide(1)">Indietro</button>`);
 $('parseWorkoutText').onclick=()=>{try{
  const lines=$('rawWorkoutText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length)throw Error('Incolla almeno un esercizio.');
  const days=[];let current=null;
  for(const [i,line] of lines.entries()){
   if(line.startsWith('#')){
    const title=line.replace(/^#+\s*/,'').trim();if(!title)throw Error('Intestazione del giorno vuota.');
    const wd=WEEKDAYS.findIndex(x=>x&&new RegExp(x,'i').test(title));
    current={name:title,weekday:wd>0?wd:null,exercises:[]};days.push(current);continue;
   }
   if(!current){const first=Number(getProfile().trainingWeekdays?.[0])||1;current=blankManualDay(first);days.push(current);}
   const x=line.split('|').map(v=>v.trim());if(x.length<2||x.length>4)throw Error('Riga '+(i+1)+': usa Nome | 3x8-12 | 180 | Dorso');
   const match=x[1].match(/^(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?$/i);if(!match)throw Error('Riga '+(i+1)+': formato serie/ripetizioni non valido.');
   let muscle=x[3]||recognizeMuscle(x[0])||'Altro';muscle=MUSCLE_OPTIONS.find(m=>m.toLowerCase()===muscle.toLowerCase())||'Altro';
   current.exercises.push({name:x[0],sets:Number(match[1]),reps:match[3]?match[2]+'-'+match[3]:match[2],restSeconds:Number(x[2]||getProfile().defaultRestSeconds||180),muscle});
  }
  const p=getProfile();const avail=p.trainingWeekdays||[];const used=new Set();for(const d of days){if(!d.weekday||used.has(d.weekday)){d.weekday=[...avail,1,2,3,4,5,6,7].find(n=>!used.has(Number(n)))||1;}used.add(d.weekday);}
  importProgramText(JSON.stringify({schemaVersion:'1.0',program:{name:'Scheda da testo',days}}));
 }catch(e){alert('Impossibile interpretare il testo: '+e.message);}};
}
function openDocumentReference(){
 openSheet(`<h2>Hai una foto o un PDF?</h2><div class="sub">Puoi aprire la foto o il PDF come riferimento e trascrivere la scheda direttamente nell'app. <b>Il riconoscimento automatico dei documenti non è ancora disponibile</b>: non carichiamo i tuoi file su server esterni.</div>
 <label class="profile-field">Seleziona foto o PDF<input id="sourceWorkoutFile" type="file" accept="image/*,.pdf,application/pdf"></label>
 <div id="sourceWorkoutPreview" class="preview-day">Nessun documento selezionato. Puoi comunque creare la scheda manualmente.</div>
 <button class="big-btn primary" id="sourceToManual">Inserisci gli esercizi manualmente</button>
 <button class="big-btn" id="sourceToText">Incolla la scheda come testo</button><button class="big-btn" onclick="openSetupGuide(1)">Indietro</button>`);
 $('sourceWorkoutFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const target=$('sourceWorkoutPreview');if(f.size>12*1024*1024){target.textContent='File troppo grande (max 12 MB).';return;}
  if(f.type.startsWith('image/')){const reader=new FileReader();reader.onload=()=>{target.innerHTML=`<img alt="Anteprima della scheda" style="max-width:100%;height:auto;border-radius:10px" src="${reader.result}">`;};reader.readAsDataURL(f);}
  else if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){target.textContent='PDF selezionato: '+f.name+'. Aprilo dal telefono per leggerlo mentre inserisci gli esercizi.';}
  else target.textContent='Formato non supportato.';
 };
 $('sourceToManual').onclick=()=>openManualBuilder();$('sourceToText').onclick=openTextProgram;
}
function openProgramManager(){
  openSheet(`<h2>Gestione schede</h2><div class="sub">Programma attivo: ${safe(programName())} · ${PROGRAM.length} giornate. Ogni dispositivo conserva i propri dati.</div>
    <button class="big-btn primary" id="startGuide">Crea o importa una scheda</button>
    <button class="big-btn" id="manualProgram">Crea / modifica scheda manualmente</button>
    <button class="big-btn" id="textProgram">Incolla esercizi come testo</button>
    <button class="big-btn" id="imageProgram">Usa foto o PDF come riferimento</button>
    <button class="big-btn" id="importProgram">Importa JSON da file</button>
    <button class="big-btn" id="pasteProgram">Incolla JSON</button>
    <button class="big-btn" id="exportProgram">Esporta scheda JSON</button>
    <button class="big-btn" id="copyPrompt">Copia prompt per ChatGPT / Gemini / coach</button>
    <button class="big-btn" id="resetProgram">Rimuovi la scheda attiva</button>
    <p class="warn">L'importazione sostituisce la scheda visualizzata, non cancella i precedenti allenamenti. Esegui comunque un backup prima di modifiche importanti. Le sostituzioni di esercizio fatte durante l'allenamento valgono solo per quella data.</p>
    <button class="big-btn" onclick="closeSheet()">Chiudi</button>`);
  $("startGuide").onclick=()=>openSetupGuide(1);
  $("manualProgram").onclick=()=>openManualBuilder();
  $("textProgram").onclick=openTextProgram;
  $("imageProgram").onclick=openDocumentReference;
  $("importProgram").onclick=selectProgramFile;
  $("pasteProgram").onclick=openPasteProgram;
  $("exportProgram").onclick=()=>{if(!PROGRAM.length){alert("Prima crea o importa una scheda.");return;}downloadJson({schemaVersion:"1.0",program:{name:programName(),days:PROGRAM.map(d=>({name:d.title,tab:d.tab,weekday:d.weekday,sub:d.sub,note:d.note,exercises:d.ex.map(e=>({name:e.name,sets:e.sets,reps:e.reps,rir:e.rir??2,restSeconds:e.rest,muscle:e.muscle,notes:e.tip,variants:e.variants||[],bw:!!e.bw}))}))}},"scheda-personale.json");};
  $("copyPrompt").onclick=copyProfilePrompt;
  $("resetProgram").onclick=()=>{if(!confirm("Rimuovere la scheda attiva? Lo storico degli allenamenti non verrà cancellato."))return;PROGRAM=[];window.ACTIVE_PROGRAM_NAME="";localStorage.removeItem(PKEY);rebuildMuscles();state.dayId=null;closeSheet();renderDays();renderList();renderWelcome();};
}
async function importProgramText(txt, onSuccess){
  try{
    const obj=JSON.parse(txt.replace(/^\uFEFF/,""));
    const checkedDays=validateProgram(obj,true);
    const p=getProfile();
    const declared=Array.isArray(p.trainingWeekdays)?p.trainingWeekdays.map(Number):null;
    if(declared){
      const imported=checkedDays.map(d=>d.weekday).filter(Boolean);
      const mismatch=declared.length!==checkedDays.length || imported.length!==checkedDays.length || imported.some(x=>!declared.includes(x));
      if(mismatch && !confirm(`I giorni della scheda non coincidono con quelli scelti nel profilo. Profilo: ${declared.join(", ")} (1=lun ... 7=dom); scheda: ${imported.length?imported.join(", "):"non specificati"}. Importare comunque?`))return;
    }
    const name=String((obj.program||obj).name||"Scheda personalizzata");
    const dayNames=["","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
    const total=checkedDays.reduce((n,d)=>n+d.ex.length,0);
    const blocks=checkedDays.map(d=>`<div class="preview-day"><b>${safe(dayNames[d.weekday]||d.title)} · ${safe(d.title)}</b><small>${d.ex.length} esercizi · ${d.ex.reduce((n,e)=>n+e.sets,0)} serie</small><small>${d.ex.map(e=>`${safe(e.name)} (${e.sets}×${safe(e.reps)}, ${fmt(e.rest)})`).join(" · ")}</small></div>`).join("");
    openSheet(`<h2>Anteprima della scheda</h2><div class="sub">${safe(name)} · ${checkedDays.length} giorni · ${total} esercizi. Controlla tutto prima di confermare.</div>${blocks}<p class="warn">L'importazione sostituirà la scheda attiva. Il vecchio storico non sarà cancellato, ma i nuovi esercizi avranno ID separati.</p><button class="big-btn primary" id="approveProgram">Conferma e importa</button><button class="big-btn" onclick="openSetupGuide(3)">Annulla</button>`);
    $("approveProgram").onclick=()=>{try{setProgram(obj);if(typeof onSuccess==="function")onSuccess();closeSheet();renderWelcome();showToast("Scheda importata correttamente");setActiveNav("workout");}catch(err){alert("Importazione non riuscita: "+err.message);}};
  }catch(e){alert("JSON non valido: "+e.message);}
}
